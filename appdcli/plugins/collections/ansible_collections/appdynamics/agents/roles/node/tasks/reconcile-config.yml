- name: Reconcile existing config file for upgrade
  vars:
    config_file_path: "{{ node_agent_dest_folder}}/appd-config.js"

  block:
    - name: Check if JavaScript file exists
      ansible.builtin.stat:
        path: "{{ config_file_path }}"
      register: js_file_exists

    - name: Read JavaScript file
      when: js_file_exists.stat.exists
      ansible.builtin.slurp:
        src: "{{ config_file_path }}"
      register: existing_config

    - name: Decode base64 content
      ansible.builtin.set_fact:
        decoded_content: "{{ existing_config.content | b64decode }}"
      when: existing_config.content is defined

    - name: Extract existing values
      when: existing_config.content is defined
      ansible.builtin.set_fact:
        json_block: "{{ decoded_content | regex_findall('appd\\.profile\\((\\{[^}]*\\})\\);', multiline=True, ignorecase=True) | first }}"

    - name: Extract accountName using regex
      ansible.builtin.set_fact:
        existing_account_name: "{{ json_block | regex_search('accountName: \"([^\"]+)\"', '\\1') | first |  default('') }}"

    - name: Extract accountAccessKey using regex
      ansible.builtin.set_fact:
        existing_account_access_key: "{{ json_block | regex_search('accountAccessKey: \"([^\"]+)\"', '\\1') | first | default('') }}"
        
    - name: Extract controllerHostName using regex
      ansible.builtin.set_fact:
        existing_controller_host_name: "{{ json_block | regex_search('controllerHostName: \"([^\"]+)\"', '\\1') | first | default('') }}"
        
    - name: Extract controllerPort using regex
      ansible.builtin.set_fact:
        existing_controller_port: "{{ json_block | regex_search('controllerPort: (\\d+)', '\\1') | first | default(false) }}"

    - name: Extract controllerSslEnabled using regex
      ansible.builtin.set_fact:
        existing_controller_ssl_enabled: "{{ json_block | regex_search('controllerSslEnabled: (true|false)', '\\1') | first | default(false) }}"
        
    - name: Extract applicationName using regex
      ansible.builtin.set_fact:
        existing_application_name: "{{ json_block | regex_search('applicationName: \"([^\"]+)\"', '\\1') | first | default('') }}"
        
    - name: Extract tierName using regex
      ansible.builtin.set_fact:
        existing_tier_name: "{{ json_block | regex_search('tierName: \"([^\"]+)\"', '\\1') | first | default('') }}"
        
    - name: Extract nodeName using regex
      ansible.builtin.set_fact:
        existing_node_name: "{{ json_block | regex_search('nodeName: \"([^\"]+)\"', '\\1') | first | default('') }}"
        
    - name: Extract enableGraphQL using regex
      ansible.builtin.set_fact:
        existing_enable_graphql: "{{ json_block | regex_search('enableGraphQL: (true|false)', '\\1') | first | default(false) }}"

    - name: Extract noNodeNameSuffix using regex
      ansible.builtin.set_fact:
        existing_no_node_name_suffix: "{{ json_block | regex_search('noNodeNameSuffix: (true|false)', '\\1') | first | default(false) }}"
        
    - name: Extract debug using regex
      ansible.builtin.set_fact:
        existing_debug: "{{ json_block | regex_search('debug: (true|false)', '\\1') | first | default(false) }}"

    - name: Add merged_values as a fact
      ansible.builtin.set_fact:
        # merged_values:
        application_name: "{{ application_name if (application_name is defined and application_name != '') else existing_application_name }}"
        controller_account_name: "{{ existing_account_name }}"
        controller_account_access_key: "{{ existing_account_access_key }}"
        controller_host_name: "{{ existing_controller_host_name }}"
        controller_port: "{{ existing_controller_port }}"
        enable_ssl: "{{ existing_controller_ssl_enabled == true }}"
        tier_name: "{{ existing_tier_name if (tier_name is undefined or tier_name == '') else tier_name }}"
        agent_node_name: "{{ node_name if (node_name is defined and node_name != '') else existing_node_name }}"
        node_agent_enableGraphQL: "{{ existing_enable_graphql | lower }}"
        no_node_name_suffixr: "{{ existing_no_node_name_suffix | lower }}"
        node_agent_debug_logging: "{{ existing_debug | lower }}"