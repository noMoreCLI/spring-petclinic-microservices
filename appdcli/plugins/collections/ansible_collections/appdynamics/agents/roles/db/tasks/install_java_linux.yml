---
- name: Install OpenJDK on Redhat
  ansible.builtin.yum:
    update_cache: yes
    name: java-1.8.0-openjdk
    state: installed
  when: "ansible_os_family == 'RedHat'"

- name: Install Java on Debian
  ansible.builtin.apt:
    name: default-jre
    state: present
    update_cache: yes
  when: "ansible_os_family == 'Debian'"
