---
dependency:
  name: galaxy
driver:
  name: docker

platforms:
  - name: instance-1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-centos7}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: instance-2
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2204}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
scenario:
  name: error-while-taking-backup
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
provisioner:
  name: ansible
  playbooks:
    prepare: ../common/prepare.yml
verifier:
  name: ansible