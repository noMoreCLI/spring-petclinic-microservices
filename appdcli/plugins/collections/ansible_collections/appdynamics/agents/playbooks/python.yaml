---
- name: Install Python Agent
  hosts: all
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3 # change to /usr/bin/python if only one version installed
  tasks:
  
    - name: Include variables for the controller settings
      # Include all yaml files under the vars directory
      ansible.builtin.include_vars:
        dir: vars
        extensions:
          - 'yaml'
          - 'yml'

    - name: Install Agent
      ansible.builtin.include_role:
        name: appdynamics.agents.python
      vars:
        agent_version: latest # [latest or provide the specific agent version]
        agent_type: python
        agent_action: install # can be upgrade/install/rollback, default upgrade when unspecified
        # Python specific Args
        install_env: default # [default - (main python path taken automatically), virtualenv - (virtualenv path need to be provided)]
        virtualenv_path: /home/ansible/venv # if environment is virtualenv then path else None
        install_agent_from: pypi # [pypi - (using pip), appd-portal - (using whl file)]
        # agent_config_path: /home/ansible/appd.cfg # this will pick the existing config file (in case of upgrade only) and will use its value to create a new config in agent installation path to maintain agent lifecycle through ansible.