---
# Tasks to download agent via http into the desired destination directory

- name: Downloading Agent via HTTP
  ansible.windows.win_get_url:
    url: '{{ agent_source_location }}'
    dest: '{{ agent_destination_path }}'
    force: 'true'
    url_username: "{{ lookup('env', 'CUSTOM_HTTP_USERNAME') if lookup('env', 'ENABLE_CUSTOM_HTTP') is defined and lookup('env', 'CUSTOM_HTTP_USERNAME') else omit }}"
    url_password: "{{ lookup('env', 'CUSTOM_HTTP_PASSWORD') if lookup('env', 'ENABLE_CUSTOM_HTTP') is defined and lookup('env', 'CUSTOM_HTTP_PASSWORD') else omit }}"
  changed_when: false
  register: result
  failed_when: result.status_code != 200

- name: Print download results
  ansible.builtin.debug:
    msg: "{{ result }}"
