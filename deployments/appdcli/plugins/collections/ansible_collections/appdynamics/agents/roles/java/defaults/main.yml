# Java Agent Linux
#java_agent_dest_folder_linux: /opt/appdynamics/java-agent
java_agent_dest_file: java-agent.zip

# Java Agent Windows
#java_agent_dest_folder_win: C:\appdynamics\java-agent

node_name: "{{ host_name + '-' + tier_name if tier_name is defined else host_name }}"


agent_dir_permission:
  user:  "{{ appdynamics_user }}"
  group: "{{ appdynamics_group }}"

create_appdynamics_user: yes

is_simple_hostname: "{{ java_agent_is_simple_hostname | default('false') }}"
runtime_dir: "{{ java_agent_runtime_dir | default('') }}"
encrypted_creds: "{{ java_agent_encrypted_creds | default('') }}"
credential_store_file: "{{ java_agent_credential_store_file | default('') }}"
credential_store_pass: "{{ java_agent_credential_store_pass | default('') }}"
credential_store_format: "{{ java_agent_credential_store_format | default('') }}"
ssl_client_auth: "{{ java_agent_ssl_client_auth | default('false') }}"
assymetric_keystore_name: "{{ java_agent_assymetric_keystore_name | default('') }}"
assymetric_keystore_pass: "{{ java_agent_assymetric_keystore_pass | default('') }}"
assymetric_key_pass: "{{ java_agent_assymetric_key_pass | default('') }}"
assymetric_key_alias: "{{ java_agent_assymetric_key_alias | default('') }}"
force_registration: "{{ java_agent_force_registration | default('false') }}"
auto_naming: "{{ java_agent_auto_naming | default('false') }}"
enable_orchestration: "{{ java_agent_enable_orchestration | default('false') }}"