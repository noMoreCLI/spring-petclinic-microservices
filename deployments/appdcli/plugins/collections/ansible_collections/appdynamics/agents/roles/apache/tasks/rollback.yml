# get Apache Agent from Rollback
- name: This is a Rollback, Fetch apache agent from backup
  block:
    - name: Ensure application agent dir exists
      ansible.builtin.file:
        path: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native"
        state: directory
        mode: "0755"
        recurse: true
      changed_when: false # this ensures this task is idempotent

    - name: Find backed up agent files from backup dir
      ansible.builtin.find:
        path: "{{ apache_agent_backup_folder_linux }}"
        patterns: 'agent*'
      register: agentfiles

    - ansible.builtin.fail:
        msg:
          - "Failure occured while doing rollback. As no backup file is present."
          - "If your intent was to remove the agent, please use the 'uninstall' task"
      when: agentfiles.files | count == 0

    - ansible.builtin.debug:
        msg: 'Agent backup dir - {{ apache_agent_backup_folder_linux }},  backup files exist - {{ agentfiles.files | count > 0 }}'
      when: agentfiles.files | count > 0

    - block:
        - name: Clean up old agent
          ansible.builtin.include_tasks: cleanup-agent.yml

        - name: Get the latest created backup file
          ansible.builtin.set_fact:
            latestagent: "{{ (agentfiles.files | sort(attribute='path'))[-1:] }}"

        - name: Unzip this Agent file from backup folder to {{ agent_dest_folder_linux }}
          ansible.builtin.unarchive:
            src: "{{ latestagent[0].path }}"
            dest: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native"
            mode: "0755"
            remote_src: true
          changed_when: false

        - name: Delete this agent backup file after restoring
          ansible.builtin.file:
            state: absent
            path: "{{ latestagent[0].path }}"
          changed_when: false
        
        - name: Copy config file to custom location
          when: custom_agent_path is defined
          block:
            - name: Copy config file
              ansible.builtin.copy:
                src: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native/conf/appdynamics_agent.conf"
                dest: "{{ custom_agent_config_path }}"
                remote_src: true
                mode: '0755'
            
            - name: Delete config file from agent directory
              ansible.builtin.file:
                path: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native/conf/appdynamics_agent.conf"
                state: absent

        - name: Run the install.sh command
          ansible.builtin.command:
            chdir: '{{ apache_agent_dest_folder }}/appdynamics-sdk-native'
            cmd: ./install.sh
          register: output
          changed_when: false
        
        - name: Notifying Agent State to Handler
          ansible.builtin.debug:
            msg: "Notifying handler for successful Agent rollback"
          changed_when: true
          notify: "Verify apache agent state"
          when: (agent_action|lower == rollback_string)
