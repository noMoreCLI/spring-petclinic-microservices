agent:
  discovery:
    enabled: true
certmanager:
  enabled: true
clusterName: clus-xxx
environment: clus-xxx
gateway:
  enabled: false
operator:
  enabled: true
operatorcrds:
  install: true
extraAttributes:
  custom:
    - name: "appd_app_name"
      value: "Petclinic-xxx"
  fromLabels:
    - key: io.kompose.service
      from: pod
      tag_name: appd_tier_name
splunkPlatform:
  endpoint: <HEC Endpoint>
  token: <HEC Token>
  index: k8s_test_logs
  logsEnabled: true
  metricsEnabled: true
  metricsIndex: k8s_test_metrics
