---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check if Agent installed with the specific version as playbook
    block:

      - name: Find if Appdynamics Python Agent Exists
        shell: "pip3 freeze | sed -n -e '/^appdynamics/p'"
        register: agent_status
        ignore_errors: true
      
      - name: Assert that Latest Python Version is installed
        assert:
          that: 
            - agent_status.stdout_lines | count > 0
          success_msg: "Agent installed from Appd portal"
          fail_msg: "Agent not installed from Appd portal"
  
  - name: Check if wheel folder exists with files
    block:
      - name: Check if wheel folder exists
        stat:
          path: /opt/appdynamics/python-agent/wheel
        register: wheel_exists
      
      - name: Check if wheel has files
        find:
          paths: /opt/appdynamics/python-agent/wheel
          file_type: file
        register: files_found
      
      - name: Assert that wheel has files
        assert:
          that: 
            - files_found.files | count > 0
          success_msg: "Wheel files exist"
          fail_msg: "Wheel Files does not exist"

  
  - name: Check if appd.cfg file exists in destination
    block:
      - name: Check if config File present
        stat:
          path: "/opt/appdynamics/python-agent/appd.cfg"
        register: config_found

      - name: Assert that Config file found
        assert:
          that: 
            - config_found.stat.exists
          success_msg: "Config File Found in Agent Destination"
          fail_msg: "Config File Not Fount in Agent Destination. Check Failed"
      
      - name: Read configuration file
        shell: "cat /opt/appdynamics/python-agent/appd.cfg"
        register: config
      
      - name: Assert that Config has correct app name
        assert:
          that: 
            - config is search("app=random_app")
          success_msg: "Config File Correct"
          fail_msg: "Config File Not Correct"
