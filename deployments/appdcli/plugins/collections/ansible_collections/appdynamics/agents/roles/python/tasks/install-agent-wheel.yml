- name: Agent wheel install block
  become: "{{ run_with_root }}"
  block:
    - name: Python Version path for Python in case of default install [AppDPortal]
      ansible.builtin.set_fact:
        version_cmd: python3 --version
      when: install_env == "default"

    - name: Python Version path for Python in case of Virtualenv [AppDPortal]
      ansible.builtin.set_fact:
        version_cmd: "{{ python_path.split('/')[:-1] | join('/') }}/python --version"
      when: install_env == "virtualenv"

    - name: Python Version installed on remote machine [AppDPortal]
      ansible.builtin.command: "{{ version_cmd }}"
      register: py_version
      changed_when: false

    - name: Extract Version identifier [AppDPortal]
      ansible.builtin.set_fact:
        exact_version: "{{ py_version.stdout.split(' ').1 | string }}"

    - name: Create whl file identifier [AppDPortal]
      ansible.builtin.set_fact:
        whl_identifier: "cp{{ exact_version.split('.')[:-1] | join('') }}"

    - name: Finding whl version [AppDPortal]
      ansible.builtin.find:
        paths: "{{ python_agent_dest_folder }}/wheel"
        patterns: '*-{{ whl_identifier }}*.whl'
      register: bindeps_file

    - name: Bindeps version Found [AppDPortal]
      ansible.builtin.debug:
        msg: "{{ bindeps_file.files[0].path }}"
      when: bindeps_file.files | length != 0

    - name: Bindeps version not Found [AppDPortal]
      ansible.builtin.debug:
        msg: "{{ whl_identifier }} bindeps version not found in directory"
      when: bindeps_file.files | length == 0

    - when: bindeps_file.files | length != 0
      block:
        - name: Fiding Proxy wheel file [AppDPortal]
          ansible.builtin.find:
            paths: "{{ python_agent_dest_folder }}/wheel"
            patterns: 'appdynamics_proxysupport*.whl'
          register: proxy_file

        - name: Finding Agent wheel file [AppDPortal]
          ansible.builtin.find:
            paths: "{{ python_agent_dest_folder }}/wheel"
            patterns:
              - 'appdynamics-*.whl'
              - 'appdynamics_alpine-*.whl'
          register: agent_file

        - name: Installing Python Agent, Bindeps and Proxy Support in Default path [AppDPortal]
          ansible.builtin.pip:
            name:
              - " {{ python_agent_dest_folder }}/wheel/{{ bindeps_file.files[0].path.split('/')[-1] }}"
              - " {{ python_agent_dest_folder }}/wheel/{{ proxy_file.files[0].path.split('/')[-1] }}"
              - " {{ python_agent_dest_folder }}/wheel/{{ agent_file.files[0].path.split('/')[-1] }}"
            executable: pip3
          when: install_env == "default"

        - name: Installing Python Agent, Bindeps and Proxy Support in Virtualenv [AppDPortal]
          ansible.builtin.pip:
            name:
              - " {{ python_agent_dest_folder }}/wheel/{{ bindeps_file.files[0].path.split('/')[-1] }}"
              - " {{ python_agent_dest_folder }}/wheel/{{ proxy_file.files[0].path.split('/')[-1] }}"
              - " {{ python_agent_dest_folder }}/wheel/{{ agent_file.files[0].path.split('/')[-1] }}"
            virtualenv: "{{ virtualenv_path }}"
          when: install_env == "virtualenv"
  rescue:
    - name: Agent Installation Task Failed
      ansible.builtin.fail:
        msg: "Error Occurred while installing agent. Task Failed {{ ansible_failed_task.name }}"
