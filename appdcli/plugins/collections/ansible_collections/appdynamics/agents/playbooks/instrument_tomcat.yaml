---
- name: Instrument Tomcat
  hosts: all
  roles:
    - role: appdynamics.agents.java
      vars:
        agent_version: 22.6.0
        agent_type: sun-java
  pre_tasks:
    - name: Include variables for the controller settings
      # Include all yaml files under the vars directory
      ansible.builtin.include_vars:
        dir: vars
        extensions:
          - 'yaml'
          - 'yml'
  tasks:
    - ansible.builtin.include_role:
        name: appdynamics.agents.instrument_tomcat
      vars:
        application_name: Tomcat
        # tier_name: Tomcat - this is optional as this will be taken care by appd auto naming
        tomcat_config: /usr/share/tomcat/bin/catalina.sh
        app_user: tomcat
        tomcat_service: tomcat
        restart_app: no
        agent_version: 22.6.0
