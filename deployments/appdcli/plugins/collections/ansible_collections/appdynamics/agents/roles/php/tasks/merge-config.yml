- name: Merging new config to current config
  become: true
  when: (agent_action == upgrade_string)
  block:
    - name: Assert if required parameters are defined
      ansible.builtin.assert:
        that:
          - default_agent_config is defined
          - agent_config is defined
          - controller_info_variable_map is defined
        msg: 'Required Parameters are not defined .Please check the ansible script'

    - name: Creating dict for default values to be merged
      ansible.builtin.set_fact:
        default_values_dict:
            applicaion_name: "{{ appd.ansible_facts.appdynamics.app }}"
            tier_name: "{{ appd.ansible_facts.appdynamics.tier }}"
            node_name: "{{ appd.ansible_facts.appdynamics.node }}"

    - name: Merging previous config with current config
      ansible.builtin.set_fact:
        merged_config: "{{ merged_config | default({}) | combine({item.key: default_agent_config.get(item.key)
          if agent_config.get(item.key) != default_agent_config.get(item.key) and default_agent_config.get(item.key) 
          != '' else agent_config.get(item.key)}) }}"
      with_dict: "{{ controller_info_variable_map }}"

    - name: Merging default_values parameters to current config
      ansible.builtin.set_fact:
        merged_config: "{{ merged_config | default({}) | combine({item.key: agent_config.get(item.key)
          if merged_config.get(item.key) == item.value else merged_config.get(item.key)}) }}"
      with_dict: "{{ default_values_dict }}"

    - name: Merging log_directory and agent_log_level to current config
      ansible.builtin.set_fact: 
        merged_config: "{{ merged_config | default({}) | combine({item: default_agent_config.get(item)
          if agent_config.get(item) != default_agent_config.get(item) and default_agent_config.get(item) != ''
          else agent_config.get(item)}) }}"
      loop:
        - "log_directory"
        - "agent_log_level"

    - name: Setting enviroment for installation config
      ansible.builtin.set_fact:
        agent_config: "{{ merged_config }}"
    
    - name: Logging updated config parameters
      ansible.builtin.debug:
        msg: "{{ agent_config }}"

  rescue:
    - name: Error occured while doing merging tasks
      ansible.builtin.debug:
        msg: 'Error occured while doing merge task cannot merge latest config using old config for {{ agent_action }} failed at - {{ ansible_failed_task.name }}'
    
    - name: Notifying to handler for failure
      ansible.builtin.debug:
        msg: "Notifying handler for task failure"
      changed_when: true
      notify: "Logging for failures"