---

- name: Converge
  hosts: all
  gather_facts: true
  vars:
    agent_version: latest # [latest or provide the specific agent version]
    agent_type: python
    agent_action: install # can be upgrade/install/rollback, default upgrade when unspecified
    install_agent_from: appd-portal
    create_appdynamics_user: true
    # Python specific Args - Taking Default Values to test default Scene
    # Controller Specific Args
    controller_host_name: "random-controller"
    controller_port: "8090"
    controller_account_name: "random-customer"
    controller_account_access_key: "random-access-key"
    add_install_type_env_var: false
    application_name: random_app
    tier_name: random_tier

  pre_tasks:
    - include_tasks:
        file: ../common/pre-task.yml

  roles:
    - role: appdynamics.agents.python