---
- hosts: localhost
  tasks:
    - block:
      - name: Make sure lxml is installed on the Ansible Master (linux)le Master (linux)
        pip:
          name: lxml
        delegate_to: localhost
      - name: Make sure jq is installed on the Ansible Master (linux)
        package:
          name: jq
      when: ansible_os_family in ['RedHat', 'Debian', 'Suse']