---
- name: Converge
  hosts: all

  vars:
    # Define Agent Type and Version
    create_appdynamics_user: true
    agent_type: php
    agent_action: upgrade 
    application_name: app_new
    tier_name: tier_new
    node_name: node_new
    log_directory: "/opt/appdynamics/php-agent/appd_logs"
    zts_support: false
    # Controller Specific Args
    controller_host_name: "random-controller"
    controller_port: "8090"
    controller_account_name: "random-customer"
    controller_account_access_key: "random-access-key"
    download_protocol: http
    download_uri: "https://download-files.appdynamics.com/download-file/php-tar/23.2.0.684/appdynamics-php-agent-x64-linux-23.2.0.684.tar.bz2"

  roles:
    - role: appdynamics.agents.php