## .Net Agent role default installation settings
dotnet_agent_dest_folder_win: C:\\appdynamics\\dotnet-agent # '/' does not work with win_package due to msiexec.
dotnet_agent_backup_folder_win: C:\\appdynamics\\backup\\dotnet-agent
dotnet_agent_msi_name: dotNetAgentSetup64.msi
dotnet_agent_ad_setup_xml_name: ad_setup.xml
dotnet_agent_config_xml_name: config.xml

## do not restart instrumented applications after installation/uninstallation to not touch the customer environment without a permission
restart_app: "false"

## .Net Agent configuration defaults
enable_tls12: "false"
monitor_all_IIS_apps: "true"
