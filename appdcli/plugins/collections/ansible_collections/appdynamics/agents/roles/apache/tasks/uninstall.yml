- name: Agent uninstall block
  become: true
  block:
    - name: Check backup directory
      ansible.builtin.stat:
        path: "{{ apache_agent_backup_folder_linux }}"
      register: backup_dir

    - name: Delete backup folder
      ansible.builtin.file:
        path: "{{ apache_agent_backup_folder_linux }}"
        state: absent
      when: backup_dir.stat.exists and not keep_backup
      changed_when: false

    - name: Clean up old agent
      ansible.builtin.file:
        path: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native"
        state: absent
      changed_when: false # this ensures this task is idempotent
    
    - name: Clean up conf file at custom location
      ansible.builtin.file:
        path: "{{ custom_agent_config_path }}"
        state: absent
      when: custom_agent_config_path is defined

    - name: Update the apache conf file
      ansible.builtin.lineinfile:
        path: '{{ apache_conf_path }}'
        regexp: '.*appdynamics_agent.conf'
        state: absent
    
    - name: Update the apache conf file for custom path
      ansible.builtin.lineinfile:
        path: '{{ apache_conf_path }}'
        regexp: '.*{{ custom_agent_config_path }}'
        state: absent
      when: custom_agent_config_path is defined

    - name: Update the apache env file
      ansible.builtin.lineinfile:
        path: '{{ apache_env_path_debain }}'
        regexp: '^export LD_LIBRARY_PATH='
        state: absent
      when: "ansible_os_family == 'Debian'"

    # remove the ansible installed agent type from environment variable containing list
    - ansible.builtin.shell: "echo ${{ ansible_install_env_var }}"
      changed_when: false
      register: install_env_var_value

    - ansible.builtin.set_fact:
        ansible_install_agent_type: "{{ installed_agent_types | join(',') }}"
      vars:
        installed_agent_types: "{{ ((install_env_var_value.stdout).split(',')) | reject('equalto', 'apache') | list }}"

    - ansible.builtin.lineinfile:
        path: "/etc/environment"
        regexp: "^{{ ansible_install_env_var }}(.*)$"
        state: absent
      when: ansible_install_agent_type | length == 0 # remove the variable entry

    - ansible.builtin.lineinfile:
        path: "/etc/environment"
        line: "{{ ansible_install_env_var }}={{ ansible_install_agent_type }}"
        regexp: "^{{ ansible_install_env_var }}(.*)$"
        state: present
      when: ansible_install_agent_type | length != 0 and "'apache' in (install_env_var_value.stdout).split(',')"
