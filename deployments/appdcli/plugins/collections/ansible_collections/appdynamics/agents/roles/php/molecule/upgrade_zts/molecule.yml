---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance-1
    image: php:7.4-zts
    dockerfile: ./common/Dockerfile
    build:
      context: .
    cgroupns_mode: host
    privileged: true
    pre_build_image: false
scenario:
  name: upgrade_zts
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
provisioner:
  name: ansible
  playbooks:
    prepare: ../common/prepare_agent_with_zts.yml
verifier:
  name: ansible
