---
- ansible.builtin.debug:
    msg: "'keep_backup' set to => {{ keep_backup }}. When false, agent backup files are also deleted. Default true."

- become: true
  when: ansible_os_family in ['RedHat', 'Debian', 'Suse']
  block:
    - name: Delete java agent install folder linux {{ java_agent_install_path_linux }}
      ansible.builtin.file:
        state: absent
        path: "{{ java_agent_install_path_linux }}"

    - name: Set the Installation path fact
      ansible.builtin.set_fact:
        java_agent_dest_folder: "{{ java_agent_install_path_linux }}"

    - name: Delete java agent backup folder linux {{ java_agent_backup_folder_linux }}
      ansible.builtin.file:
        state: absent
        path: "{{ java_agent_backup_folder_linux }}"
      when: not keep_backup

    #remove the ansible installed agent type from environment variable containing list
    - ansible.builtin.shell: "echo ${{ ansible_install_env_var }}"
      changed_when: false
      register: install_env_var_value

    - ansible.builtin.set_fact:
        ansible_install_agent_type: "{{ installed_agent_types | join(',') }}"
      vars:
        installed_agent_types: "{{ ((install_env_var_value.stdout).split(',')) | reject('equalto', 'java') | list }}"

    - ansible.builtin.lineinfile:
        path: "/etc/environment"
        regexp: "^{{ ansible_install_env_var }}(.*)$"
        state: absent
      when: ansible_install_agent_type | length == 0 # remove the variable entry

    - ansible.builtin.lineinfile:
        path: "/etc/environment"
        line: "{{ ansible_install_env_var }}={{ ansible_install_agent_type }}"
        regexp: "^{{ ansible_install_env_var }}(.*)$"
        state: present
      when: ansible_install_agent_type | length != 0 and "'java' in (install_env_var_value.stdout).split(',')"


- when: ansible_os_family == 'Windows'
  block:
    - name: Delete java agent install folder windows {{ java_agent_install_path_windows }}
      ansible.windows.win_file:
        state: absent
        path: "{{ java_agent_install_path_windows }}"

    - name: Set the Installation path fact
      ansible.builtin.set_fact:
        java_agent_dest_folder: "{{ java_agent_install_path_windows }}"

    - name: Delete java agent backup folder windows {{ java_agent_backup_folder_windows }}
      ansible.windows.win_file:
        state: absent
        path: "{{ java_agent_backup_folder_windows }}"
      when: not keep_backup

    #remove the ansible installed agent type from environment variable containing list
    - ansible.windows.win_shell: "[System.Environment]::GetEnvironmentVariable('{{ ansible_install_env_var }}')"
      changed_when: false
      register: install_env_var_value

    - ansible.builtin.set_fact:
        ansible_install_agent_type: "{{ installed_agent_types | join(',') }}"
      vars:
        installed_agent_types: "{{ ((install_env_var_value.stdout_lines[0]).split(',')) | reject('equalto', 'java') | list }}"
      when: install_env_var_value.stdout_lines | count > 0

    - ansible.windows.win_environment:
        state: absent
        level: machine
        name: "{{ ansible_install_env_var }}"
      when: ansible_install_agent_type | default('') | length == 0

    - ansible.windows.win_environment:
        state: present
        level: machine
        name: "{{ ansible_install_env_var }}"
        value: "{{ ansible_install_agent_type }}"
      when: ansible_install_agent_type | default('') | length != 0

  rescue:
    - name: appdynamics_agent_status Output Failed Status
      ansible.builtin.set_fact:
        java_playbook_failed: true

    - ansible.builtin.debug:
        msg: "Error occured while uninstalling java agent. Please stop the application using agent files and then retry uninstalling."

- name: agent start up result set fact
  ansible.builtin.set_fact:
    agent_result:
      app: "{{ application_name | default('') }}"
      tier: "{{ tier_name | default('') }}"
      node: "{{ node_name | default('') }}"
      error: false
      install_path: "{{ java_agent_dest_folder | default('') }}"
      agent_type: "{{ agent_type | default('java') }}"
      agent_version: "{{ agent_version | default('') }}"
      action: "{{ agent_action | default('') }}"

- name: appdynamics.agent.result
  ansible.builtin.debug:
    msg: "{{ agent_result | to_json }}"


- name: appdynamics_agent_status Output Success Status
  ansible.builtin.debug:
    msg: "Playbook run was successful"
  when: not java_playbook_failed