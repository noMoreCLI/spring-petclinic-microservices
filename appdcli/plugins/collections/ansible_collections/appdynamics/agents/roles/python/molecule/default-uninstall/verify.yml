---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check if Agent installed with the specific version as playbook
    block:

      - name: Find if Appdynamics Python Agent Exists
        shell: "pip3 freeze | sed -n -e '/^appdynamics[=,@]/p'"
        register: agent_status
        ignore_errors: true
      
      - name: Assert that agent uninstalled
        assert:
          that: 
            - agent_status.stdout_lines | count == 0
          success_msg: "Uninstall Done"
          fail_msg: "Uninstall not Done"
  
  - name: Check if Agent Destination exists
    block:
      - name: Check if Agent folder exists
        stat:
          path: /opt/appdynamics/python-agent/
        register: agent_exists
    
      - name: Assert that Agent is empty
        assert:
          that: 
            - not agent_exists.stat.exists
          success_msg: "Agent Destination Deleted"
          fail_msg: "Agent Destination not Deleted"

  - name: Check if backup exists
    block:
      - name: Check if backup folder exists
        stat:
          path: /opt/appdynamics/backup/python-agent/
        register: backup_exists

      - name: Assert that backup is empty
        assert:
          that: 
            - not backup_exists.stat.exists
          success_msg: "Backup Deleted"
          fail_msg: "Backup not Deleted"
