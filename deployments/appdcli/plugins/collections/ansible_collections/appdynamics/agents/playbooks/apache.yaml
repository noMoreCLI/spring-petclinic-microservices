---
- name: Install Apache agent
  hosts: all

  tasks:
    - name: Include variables for the controller settings
      # Include all yaml files under the vars directory
      ansible.builtin.include_vars:
        dir: vars
        extensions:
          - 'yaml'
          - 'yml'

    - name: Install Agent
      ansible.builtin.include_role:
        name: appdynamics.agents.apache
      vars:
        agent_version: 22.12.1 # [latest or provide the specific agent version]
        agent_type: apache
        agent_action: upgrade
        # linux_custom_agent_install_path: "/opt"
        # custom_agent_config_path: "/etc/httpd/conf/appdynamics_agent.conf"
