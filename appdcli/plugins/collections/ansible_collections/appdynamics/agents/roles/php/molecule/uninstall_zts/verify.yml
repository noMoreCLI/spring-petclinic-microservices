---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: true
  vars:
    # Expected agent variables
    expected_agent_version: "22.10.0.627"
    expected_application_name: app
    expected_tier_name: tier
    expected_node_name: node
    expected_controller_host_name: "random-controller"
    expected_controller_port: "8090"
    expected_controller_account_name: "random-customer"
    expected_controller_account_access_key: "random-access-key"


  tasks:
  - name: Check if Agent is uninstalled from the system
    block:

      - name: Find if appdynamics agent is installed in system
        shell: "php -m | grep appdynamics_agent"
        register: agent_status
        ignore_errors: true

      - name: Find if agent ini file is removed from the system
        shell: "php -i | grep appdynamics_agent.ini"
        register: agent_ini
        ignore_errors: true

      - name: Check if agent directory exists
        stat:
          path: "/opt/appdynamics/php-agent/appdynamics-php-zts-agent-linux_x64"
        register: agent_dir_check
      
      - name: Check if backup directory exists
        stat:
          path: "/opt/appdynamics/backup/php_agent"
        register: backup_dir_check
      
      - name: Assert if uninstall works properly
        assert:
          that:
            - agent_status.rc == 1
            - agent_ini.rc == 1
            - not agent_dir_check.stat.exists
            - not backup_dir_check.stat.exists
          success_msg: "Agent successfully uninstalled"
          fail_msg: "Failure in uninstall task please check the ansible code!"