---
- become: true
  block:
    - name: Install Java 1.8
      ansible.builtin.yum:
        name: java-1.8.0-openjdk
        state: present

    - name: add group "tomcat"
      ansible.builtin.group:
        name: tomcat

    - name: add user "tomcat"
      ansible.builtin.user:
        name: tomcat
        group: tomcat
        home: /usr/share/tomcat
        createhome: no
      become: True
      become_method: sudo

    - name: Download Tomcat
      ansible.builtin.get_url:
        url: http://archive.apache.org/dist/tomcat/tomcat-7/v7.0.61/bin/apache-tomcat-7.0.61.tar.gz
        dest: /opt/apache-tomcat-7.0.61.tar.gz

    - name: Extract archive
      ansible.builtin.unarchive:
        src: /opt/apache-tomcat-7.0.61.tar.gz
        dest: /opt/
        remote_src: true

    - name: Symlink install directory
      ansible.builtin.file:
        src: /opt/apache-tomcat-7.0.61
        path: /usr/share/tomcat
        state: link

    - name: Change ownership of Tomcat installation
      ansible.builtin.file:
        path: /usr/share/tomcat/
        owner: tomcat
        group: tomcat
        state: directory
        recurse: yes

    - name: Configure Tomcat server
      ansible.builtin.template:
        src: server.xml
        dest: /usr/share/tomcat/conf/
      notify: restart tomcat

    - name: Configure Tomcat users
      ansible.builtin.template:
        src: tomcat-users.xml
        dest: /usr/share/tomcat/conf/
      notify: restart tomcat

    - name: Install Tomcat init script
      ansible.builtin.copy:
        src: tomcat-initscript.sh
        dest: /etc/init.d/tomcat
        mode: 0755

    - name: Start Tomcat
      ansible.builtin.service:
        name: tomcat
        state: restarted
        enabled: yes

    - name: Start Tomcat for dev testing environment
      ansible.builtin.command: sh /usr/share/tomcat/bin/startup.sh
      changed_when: false
      become_method: sudo

    - name: deploy iptables rules
      ansible.builtin.template:
        src: iptables-save
        dest: /etc/sysconfig/iptables
      when: "ansible_os_family == 'RedHat' and ansible_distribution_major_version == '6'"
      notify: restart iptables

    - name: insert firewalld rule for tomcat http port
      ansible.posix.firewalld:
        port: "{{ http_port }}/tcp"
        permanent: true
        state: enabled
        immediate: yes
      vars: 
        ansible_python_interpreter: /usr/bin/python2.7
      when: "ansible_os_family == 'RedHat' and ansible_distribution_major_version == '7'"

    - name: insert firewalld rule for tomcat https port
      ansible.posix.firewalld:
        port: "{{ https_port }}/tcp"
        permanent: true
        state: enabled
        immediate: yes
      vars: 
        ansible_python_interpreter: /usr/bin/python2.7
      when: "ansible_os_family == 'RedHat' and ansible_distribution_major_version == '7'"

    - name: wait for tomcat to start
      ansible.builtin.wait_for:
        port: "{{ http_port }}"

    - name: Deploy a sample war file on tomcat
      ansible.builtin.get_url:
        url: https://tomcat.apache.org/tomcat-7.0-doc/appdev/sample/sample.war
        dest: /usr/share/tomcat/webapps