- name: Verify and restart .Net Agent MSI
  ansible.builtin.include_tasks: handlers/restart_verify_dotnet_agent.yml
  listen: Restart and verify .NET agent listener

# https://support.microsoft.com/en-ca/help/969864/using-iisreset-exe-to-restart-internet-information-services-iis-result
- name: Restart IIS
  ansible.windows.win_service:
    name: "{{ item.service }}"
    state: "{{ item.state }}"
    force_dependent_services: yes
  loop:
    - { service: w3svc, state: stopped }
    - { service: was, state: restarted }
    - { service: w3svc, state: started }
  listen: Restart app listener
  ignore_errors: yes # noqa ignore-errors
  when: restart_app | bool and iis_service.exists

# we cannot retsart instrumented standalone application without knowing how they were started so we should leave it to the customer; we can log a message with applications that must be restarted
- name: Restart standalone applications notice
  ansible.builtin.debug:
    msg: "Please restart {{ item.executable }}"
  listen: Restart app listener
  loop: "{{ standalone_applications }}"
  when: restart_app | bool and standalone_applications is defined and standalone_applications |length > 0

- name: Restart instrumented applications notice
  ansible.builtin.debug:
    msg: "Please restart IIS and all applications added or removed from instrumentation so that the Agent changes can apply"
  listen: Restart app listener
  when: not restart_app | bool