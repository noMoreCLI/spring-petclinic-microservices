---
- name: SmartAgent Test Play
  hosts: smartagent-hosts
  tasks:
    - name: Include variables for the controller settings
      ansible.builtin.include_vars:
        # Include all yaml files under the vars directory
        dir: vars
        extensions:
          - 'yaml'
          - 'yml'
    - ansible.builtin.include_role:
        name: appdynamics.agents.smartagent
      vars:
        # Define Agent Type and Version
        agent_type: smartagent
        agent_action: install
        agent_version: 23.9.0.920
        download_url: http://download-files.saas.appd-test.com/download-file