---
# defaults file for node agent

agent_dir_permission:
  user: "{{ appdynamics_user }}"
  group: "{{ appdynamics_group }}"

create_appdynamics_user: true

# Agent config specific details
# Will have to keep updating it
agent_dir: "{{ linux_custom_agent_install_path | default(node_agent_dest_folder) }}"

wsgi_script: ""
wsgi_callable: "application"
wsgi_module: ""
install_agent_from: "{{ npm_registry }}"

log_level: "{{ agent_log_level if agent_log_level is defined else 'info' }}"
log_debugging: off
log_dir: "{{ agent_dir }}/logs"

eum_disable_cookie: "off"
eum_user_agent_whitelist: "Mozilla, Opera, WebKit, Nokia"

snapshot_exit_call_details_length: "100"

transaction_monitor_bt_max_duration_ms: "120000"

# no_node_name_suffix_lower: "{{ no_node_name_suffix | lower }}"
agent_node_name_replaced: "{{ agent_node_name | regex_replace('-0$', '') }}"
agent_node_name: "{{ node_name | default(appd.ansible_facts.appdynamics.node) }}"
