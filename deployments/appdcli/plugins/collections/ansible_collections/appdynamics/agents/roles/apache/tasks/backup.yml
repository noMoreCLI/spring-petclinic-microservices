- name: Agent backup block
  become: true
  when: previous_agent.stat.exists
  block:
    - ansible.builtin.debug:
        msg:
          - "Does Apache agent already exists in install path - {{ previous_agent.stat.exists }}."
          - "Take agent backup before upgrading. Maximum no. of allowed backups set to {{ max_agent_backup_count }}."

    - name: Create agent backup folder
      ansible.builtin.file:
        path: "{{ apache_agent_backup_folder_linux }}"
        state: directory
        mode: "0775"
      become: true
    
    - name: Use custom install configs
      when: custom_agent_config_path is defined
      block:
        - name: Check if config exists at custom location
          ansible.builtin.stat:
            path: "{{ custom_agent_config_path }}"
          register: config_file_check

        - name: Copying config for backup
          ansible.builtin.copy:
            src: "{{ custom_agent_config_path }}"
            dest: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native/conf/appdynamics_agent.conf"
            remote_src: true
            mode: '0755'
          when: config_file_check.stat.exists
        
        - name: Unable to find config in custom location
          ansible.builtin.fail:
            msg: "Please check the path provided for config file as file does not exists on the given path."
          when: not config_file_check.stat.exists
      
    - name: Creating Temporary Config for Merging
      ansible.builtin.copy:
        src: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native/conf/appdynamics_agent.conf"
        dest: "/tmp/appdynamics_agent.conf"
        remote_src: true
        mode: '0755'
      ignore_errors: true

    - name: Archive Agent Destination # Complete Agent Directory for Backup Zip
      community.general.archive:
        path: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native/*"
        dest: "{{ apache_agent_backup_folder_linux }}/agent.{{ ansible_date_time.iso8601 }}.zip"
        mode: "0755"
        exclude_path: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native/logs"
      changed_when: false
    
    - name: Setting flag for backup successful
      ansible.builtin.set_fact:
        backup_success: true
