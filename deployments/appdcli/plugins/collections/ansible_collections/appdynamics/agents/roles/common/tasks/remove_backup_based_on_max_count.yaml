- name: Remove Backup Based on Max Backup Count Value
  become: true
  block:
    - name: Assert if backup folder is defined
      ansible.builtin.assert:
        that: agent_backup_folder is defined
        msg: 'Agent backup folder is undefined. Exiting Backup Cleanup'

    - name: Find the agents in backup dir
      ansible.builtin.find:
        path: "{{ agent_backup_folder }}"
        patterns: 'agent*'
      register: backup_files

    - ansible.builtin.debug:
        msg: "Currently max_agent_backup_count is set to 0 that means no backup will be taken. This will not allow user to perform a Rollback Later"
      when: max_agent_backup_count == 0

    - ansible.builtin.debug:
        msg: "Backed-up agent files present currently : {{ backup_files.files | count }}"
      when: max_agent_backup_count > 0

    - name: Remove agent files from backup if more than {{ max_agent_backup_count }}
      when: (backup_files.files | count > max_agent_backup_count)
      block:
        - ansible.builtin.set_fact:
            old_backup_files: "{{ (backup_files.files | sort(attribute='path'))[:-max_agent_backup_count] }}"
          when: max_agent_backup_count > 0

        - ansible.builtin.set_fact:
            old_backup_files: "{{ backup_files.files | sort(attribute='path') }}"
          when: max_agent_backup_count == 0

        - name: Delete the old backup files if more than {{ max_agent_backup_count }}
          ansible.builtin.file:
            state: absent
            path: "{{ item.path }}"
          changed_when: false
          with_items: "{{ old_backup_files }}"
          loop_control:
            label: "{{ item.path }}"
