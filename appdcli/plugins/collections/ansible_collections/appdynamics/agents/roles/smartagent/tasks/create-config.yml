- name: Create Agent Config
  block:
    - name: appdynamics_agent_status Adding new Agent config
      ansible.builtin.template:
        src: templates/config-ini.j2
        dest: "{{ smart_agent_dest_folder }}/config.ini"
        force: true
        mode: 0755
      become: true
      register: smart_agent_config  # use this to check if this state was successful in case of rollback
      when: (ansible_os_family in ['RedHat', 'Debian', 'Suse'])

    - name: appdynamics_agent_status Adding new Agent config for Windows platform
      ansible.windows.win_template:
        src: templates/config-ini.j2
        dest: "{{ smart_agent_dest_folder }}/config.ini"
      register: smart_agent_config  # use this to check if this state was successful in case of rollback
      when: (ansible_os_family in ['Windows'])
  rescue:
    - name: appdynamics_agent_status Printing to output file as error occurred while Adding Agent Config
      ansible.builtin.debug:
         msg: 'Error occurred while Adding agent config. Error: {{ ansible_failed_task.name }}'