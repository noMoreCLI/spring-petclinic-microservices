---
- ansible.builtin.include_tasks: fetch_http_linux.yml
  when: >
    ansible_os_family != 'Windows' and fetch_protocol == 'http'

- ansible.builtin.include_tasks: fetch_http_windows.yml
  when: >
    ansible_os_family == 'Windows' and  fetch_protocol == 'http'

- ansible.builtin.include_tasks: fetch_local_linux.yml
  when: >
    ansible_os_family != 'Windows' and ( fetch_protocol == 'local' or fetch_protocol == 'nfs')

- ansible.builtin.include_tasks: fetch_local_windows.yml
  when: >
    ansible_os_family == 'Windows' and fetch_protocol == 'local'

- ansible.builtin.include_tasks: fetch_nfs_windows.yml
  when: >
    ansible_os_family == 'Windows' and fetch_protocol == 'nfs'