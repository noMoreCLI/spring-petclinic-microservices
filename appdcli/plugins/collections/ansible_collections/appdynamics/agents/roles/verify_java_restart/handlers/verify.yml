# Verify Java Agent Installation
# After an installation, the agent log in <agent_home>/logs will contain the following message:
# Started AppDynamics Java Agent Successfully
- name: Wait for agent to restart
  ansible.builtin.pause:
    seconds: 10

- name: Verify java agent has started
  become: yes
  ansible.builtin.shell: set -o pipefail && cat $(ls -t {{ java_agent_ver_folder }}/logs/{{ node_name }}/agent* | head -1) | (grep -B 5 -E 'Started AppDynamics Java Agent Successfully|Could Not Start Java Agent')
  args:
    executable: /bin/bash
  retries: 3
  delay: 10
  until: agent_log.rc == 0
  register: agent_log
  failed_when: ('Could Not Start Java Agent' in agent_log.stdout) or agent_log.rc != 0
  tags:
    - skip_ansible_lint
  ignore_errors: true

- name: Record agent status
  ansible.builtin.set_fact:
    agent_started: "{{ agent_log.stdout | regex_search('Started AppDynamics Java Agent Successfully') == 'Started AppDynamics Java Agent Successfully' }}"

- name: Get registration information
  become: yes
  ansible.builtin.shell: set -o pipefail && cat $(ls -t {{ java_agent_ver_folder }}/logs/{{ node_name }}/agent* | head -1) | (grep -E 'Registration information received|controllerGUID|Controller version|Account edition from controller')
  args:
    executable: /bin/bash
  retries: 3
  delay: 10
  until: registration_info_log.rc == 0
  register: registration_info_log
  failed_when: registration_info_log.rc != 0
  tags:
    - skip_ansible_lint
  ignore_errors: true
  when: agent_started | bool 

- name: Transform registration information to standard format
  ansible.builtin.set_fact:
    registration_info: "{{ registration_info | default({}) | combine({item.key: item.value}) }}"
  with_items:
    - {'key': 'NodeId', 'value': "{{ registration_info_log.stdout | default('') | regex_search('Node ID\\[(\\d+)\\]', '\\1') | default([''], true) | first }}" }
    - {'key': 'ComponentId', 'value': "{{ registration_info_log.stdout | default('') | regex_search('Component ID\\[(\\d+)\\]', '\\1') | default([''], true) | first }}" }
    - {'key': 'ApplicationId', 'value': "{{ registration_info_log.stdout | default('') | regex_search('Application ID \\[(\\d+)\\]', '\\1') | default([''], true) | first }}" }
    - {'key': 'ControllerGUID', 'value': "{{ registration_info_log.stdout | default('') | regex_search('controllerGUID\\[(\\d+)\\]', '\\1') | default([''], true) | first }}" }
    - {'key': 'AccountGUID', 'value': "{{ registration_info_log.stdout | default('') | regex_search('accountGUID\\[([0-9a-f\\-]+)\\]', '\\1') | default([''], true) | first }}" }
    - {'key': 'ControllerVersion', 'value': "{{ registration_info_log.stdout | default('') | regex_search('Controller version \\[([0-9\\.]+)\\]', '\\1') | default([''], true) | first }}" }
    - {'key': 'AccountEdition', 'value': "{{ registration_info_log.stdout | default('') | regex_search('Account edition from controller = ([a-zA-Z0-9_\\-]+)', '\\1') | default([''], true) | first }}" }

- name: Print agent log
  ansible.builtin.debug:
    msg: "{{ agent_log.stdout }}"

- name: Print registration information
  ansible.builtin.debug:
    msg: "{{ registration_info }}"

- name: appdynamics_agent_status java
  ansible.builtin.debug:
    msg: '{ "agentStarted": "{{ agent_started }}" {% for key, value in registration_info.items() %} "{{ key }}": "{{ value }}", {% endfor %} }'
  