# get iib Agent from Rollback
- name: This is a Rollback, Fetch iib agent from backup
  block:
    - name: Ensure application agent dir exists
      ansible.builtin.file:
        path: "{{ agent_path }}/appdynamics"
        state: directory
        mode: '755'
        recurse: true
      changed_when: false # this ensures this task is idempotent

    - name: Find backed up agent files from backup dir
      ansible.builtin.find:
        path: "{{ iib_agent_backup_folder }}"
        patterns: 'agent*'
      register: agentfiles

    - ansible.builtin.fail:
        msg:
          - "Failure occured while doing rollback. As no backup file is present."
          - "If your intent was to remove the agent, please use the 'uninstall' task"
      when: agentfiles.files | count == 0

    - ansible.builtin.debug:
        msg: 'Agent backup dir - {{ iib_agent_backup_folder }},  backup files exist - {{ agentfiles.files | count > 0 }}'

      when: agentfiles.files | count > 0
    - block:
        - name: Clean up old agent
          ansible.builtin.include_tasks: cleanup-agent.yml

        - name: Get the latest created backup file
          ansible.builtin.set_fact:
            latestagent: "{{ (agentfiles.files | sort(attribute='path'))[-1:] }}"

        - name: Unzip this Agent file from backup folder to {{ agent_path }}
          ansible.builtin.unarchive:
            src: "{{ latestagent[0].path }}"
            dest: "{{ agent_path }}/appdynamics"
            mode: '755'
            remote_src: true
          changed_when: false
          when: ansible_os_family != 'AIX'

        - name: Unzip this Agent file from backup folder to {{ agent_path }}
          ansible.builtin.shell: "gunzip -c {{ latestagent[0].path }} | tar -xvf - -C {{ agent_path }}/appdynamics"
          changed_when: false
          when: ansible_os_family == 'AIX'

        - name: Delete this agent backup file after restoring
          ansible.builtin.file:
            state: absent
            path: "{{ latestagent[0].path }}"
          changed_when: false

    - name: Notifying Agent State to Handler
      ansible.builtin.debug:
        msg: "Notifying handler for successful Agent rollback"
      changed_when: true
      notify: "Verify iib agent state"
  rescue:
    - name: Setting error status
      ansible.builtin.set_fact:
        error_status: true

    - name: Printing to output file as error occurred while doing Agent Rollback
      ansible.builtin.debug:
        msg: 'Error occurred while doing Agent Rollback. Task failed - {{ ansible_failed_task.name }}'
