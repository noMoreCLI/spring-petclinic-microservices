---
- name: Install IIB Agent
  hosts: all
  gather_facts: true
  tasks:

    - name: Include variables for the controller settings
      ansible.builtin.include_vars:
        # Include all yaml files under the vars directory
        dir: vars
        extensions:
          - 'yaml'
          - 'yml'

    - name: Install Agent
      ansible.builtin.include_role:
        name: appdynamics.agents.iib
      vars:
        agent_version: latest  # [latest or provide the specific agent version]
        agent_type: iib
        agent_action: install # can be upgrade/install/rollback, default upgrade when unspecified
        config_file_path: /opt/node.conf.yaml # need to set path for node or server conf files to update UserExist (provide multiple path by using comma)
        # add_ansible_install_env_var: true
        # max_agent_backup_count: 2
        # create_appdynamics_user: true
        # appdynamics_user: ansible
