- name: Define supported OS families and architectures
  set_fact:
    supported_os_families: [ 'RedHat', 'Debian', 'Alpine', 'Suse', 'Windows' ]

- name: Check if OS family is supported
  set_fact:
    os_family_matched: "{{ ansible_os_family in supported_os_families }}"

- block:
    - name: Validate OS compatibility
      fail:
        msg: "The requested OS family '{{ ansible_os_family }}' is not supported"
      when: not os_family_matched

  rescue:
    - name: appdynamics_agent_status Output Failed Status
      ansible.builtin.set_fact:
        java_playbook_failed: true
    - name: Halt playbook execution due to unsupported system configuration
      fail:
        msg: "The playbook execution has been halted because the target system uses an unsupported OS family."
