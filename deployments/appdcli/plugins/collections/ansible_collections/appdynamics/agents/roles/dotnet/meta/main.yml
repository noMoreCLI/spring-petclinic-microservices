---
galaxy_info:
  author: Cisco AppDynamics
  role_name: dotnet
  company: Cisco AppDynamics
  description: This role installs and configures the AppDynamics .Net Agent Standalone
  license: Apache2
  min_ansible_version: "2.9"
  platforms:
    - name: Ubuntu
      versions:
        - precise
        - quantal
        - raring
        - saucy
        - trusty
        - xenial
        - artful
        - bionic
    - name: Debian
      versions:
        - wheezy
        - jessie
        - stretch
        - buster
  galaxy_tags:
    - apm
    - monitoring
    - appdynamics
    - agents
    - dotnet

dependencies:
 - { role: common }
 - { role: linux_pkg, when: ansible_os_family == 'RedHat' or  ansible_os_family == 'Debian'}
 #- { role: win_pkg, when: ansible_os_family == 'Windows' }
 #when: lookup('env', 'MOLECULE_FILE')
