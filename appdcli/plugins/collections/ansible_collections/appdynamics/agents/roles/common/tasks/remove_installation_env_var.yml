---
- ansible.builtin.set_fact:
    ansible_install_agent_type: "{{ item }}"
  when: agent_type is search(item)
  with_items: "{{ allowed_install_env_var_values }}" # types (machine|db|java|dotnet_msi|apache|python|iib)

- become: true
  when: ansible_os_family in ['RedHat', 'Debian', 'Alpine', 'AIX']
  block:
    - name: Check if installation env variable already present on host
      ansible.builtin.shell: "echo ${{ ansible_install_env_var }}"
      changed_when: false
      register: install_env_var_value

    - ansible.builtin.debug:
        msg: "Value of installation type env. variable before unsetting = {{ install_env_var_value.stdout }}"
    
    - ansible.builtin.stat:
        path: "/etc/environment"
      register: environment_file

    - when: (install_env_var_value.stdout is search(ansible_install_agent_type) and environment_file.stat.exists) #when agent type present already
      block:
        - ansible.builtin.set_fact: 
            installed_agents_list: "{{ ','.join(install_env_var_value.stdout.split(',') | reject('search', ansible_install_agent_type) | list) }}"
        
        - ansible.builtin.lineinfile: # set env variable system wide
            path: "/etc/environment"
            line: "{{ ansible_install_env_var }}={{ installed_agents_list }}"
            regexp: "^{{ ansible_install_env_var }}(.*)$"
            state: present
          when: installed_agents_list | length != 0
        
        - ansible.builtin.lineinfile:
            path: "/etc/environment"
            regexp: "^{{ ansible_install_env_var }}(.*)$"
            state: absent
          when: installed_agents_list | length == 0

    - ansible.builtin.shell: "echo ${{ ansible_install_env_var }}"
      register: install_env_var_value
      changed_when: false

    - ansible.builtin.debug:
        msg: "Value of installation type env variable - {{ install_env_var_value.stdout }}"

- when: ansible_os_family == 'Windows'
  block:
    - name: Check if installation env variable already present on host
      ansible.windows.win_shell: "[System.Environment]::GetEnvironmentVariable('{{ ansible_install_env_var }}')"
      changed_when: false
      register: install_env_var_value

    - ansible.builtin.debug:
        msg: "Value of installation type env. variable before unsetting = {{ install_env_var_value.stdout_lines }}"

    - when: install_env_var_value.stdout_lines | count > 0 and (install_env_var_value.stdout_lines[0] is search(ansible_install_agent_type))
      block:
        - ansible.builtin.set_fact: 
            installed_agents_list: "{{ ','.join(install_env_var_value.stdout.split(',') | reject('search', ansible_install_agent_type) | list) }}"
          when: install_env_var_value.stdout_lines | count > 0 and install_env_var_value.stdout_lines[0] | length != 0

        - ansible.windows.win_environment: # set env variable on machine level
            state: present
            level: machine
            name: "{{ ansible_install_env_var }}"
            value: "{{ installed_agents_list }}"
          when: ansible_install_agent_type | length != 0

        - ansible.windows.win_environment:
            state: absent
            level: machine
            name: "{{ ansible_install_env_var }}"
          when: ansible_install_agent_type | length == 0

#   - win_shell: "Get-ChildItem -Path Env:/{{ installation_type_env_var }}"
    - ansible.windows.win_shell: "[System.Environment]::GetEnvironmentVariable('{{ ansible_install_env_var }}')"
      changed_when: false
      register: install_env_var_value

    - ansible.builtin.debug:
        msg: "Value of installation type env variable - {{ install_env_var_value.stdout_lines[0] }}"
