---
linux_install_path: "/opt/appdynamics"
linux_config_path: "/etc/opt/appdynamics"
window_install_path: "C:\\appdynamics"
window_config_path: "C:\\appdynamics"

smart_agent_install_path: "{{ linux_install_path if (ansible_os_family in ['RedHat', 'Debian', 'Suse']) else window_install_path }}"
window_smart_agent_dest_folder: "{{ windows_custom_agent_install_path | default(smart_agent_install_path + '\\appdsmartagent') }}"
linux_smart_agent_dest_folder: "{{ smart_agent_install_path }}/appdsmartagent"
smart_agent_dest_folder: "{{ linux_smart_agent_dest_folder if (ansible_os_family in ['RedHat', 'Debian', 'Suse']) else window_smart_agent_dest_folder }}"
smart_agent_auto_attach_config_dir:  "{{ linux_config_path if (ansible_os_family in ['RedHat', 'Debian', 'Suse']) else window_config_path }}"
smart_agent_auto_attach_config_file: "{{smart_agent_auto_attach_config_dir}}/ld_preload.json"
auto_attach_config_file: ""
fm_service_port: 8030
controller_port: 8090
enable_ssl: false
nativeEnable: true
logLevel: info
profiling: false

agentName: "smartagent"
download_url: "https://download-files.appdynamics.com/download-file"

appdynamics_user: appdynamics
appdynamics_group: "{{ appdynamics_user }}"

agent_dir_permission:
  user:  "{{ appdynamics_user }}"
  group: "{{ appdynamics_group }}"

# Agent config specific details
# Will have to keep updating it
agent_dir: "{{ smart_agent_dest_folder }}"

install_string: install
upgrade_string: upgrade
uninstall_string: uninstall
configure_string: configure

smartagent_auto_start: false

serviceName: "smartagent-service"

pollingIntervalInSec: 300
requestTimeoutSeconds: 300

runAutoDiscovery: false
excludeLabels: "process.cpu.usage,process.memory.usage"
autoDiscoveryTimeInterval: "4h"

extraVars: "create_appdynamics_user=false,add_ansible_install_env_var=false,check_pkg_dependencies=false,download_script=py"
envVars: "ANSIBLE_STDOUT_CALLBACK=appdynamics.agents.smartagent_callback"

min_tls_version: "1.2"
max_tls_version: "1.3"
