---
- name: Agent Backup Block
  become: true
  when: (agent_action|lower != rollback_string) # extending functionality for agent_action
  block:
    - name: Check if agent is installed
      ansible.builtin.shell: "{{ php_path }} -m | grep -wq appdynamics_agent"
      register: agent_install_check
      changed_when: false
      ignore_errors: true
      failed_when: agent_install_check.rc > 1

    - name: Zipping agent directories to backup folder
      when: agent_install_check.rc == 0 # True if agent is installed
      block:
        - name: Copying ini file to agent directory if defined
          ansible.builtin.copy:
            src: "{{ agent_ini_file_path }}"
            dest: "{{ agent_path }}/{{ ini_file_name }}"
            remote_src: yes
          when: agent_ini_file_path is defined

        - name: Logging for maximum backup allowed
          ansible.builtin.debug:
            msg: "Take agent backup before upgrading. Maximum no. of allowed backups set to {{ max_agent_backup_count }}."

        - name: Run php command and filter output
          ansible.builtin.shell: "{{ php_path }} -r 'foreach (get_loaded_extensions() as $extension) echo \"$extension: \" . phpversion($extension) . \"\\n\";'
           | grep appdynamics_agent"
          register: php_output
          changed_when: false
          check_mode: false
          when: agent_install_check.rc == 0

        - name: Register version number
          ansible.builtin.shell: "echo {{ php_output.stdout }} | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+'"
          register: current_agent_version
          changed_when: false
          when: agent_install_check.rc == 0

        - name: Logging current agent version
          ansible.builtin.debug:
            msg: " The current agent installed is :-  {{ current_agent_version.stdout_lines[0] }}"

        - name: Creates if backup directories are not present
          ansible.builtin.file:
            path: "{{ php_agent_backup_folder_linux }}"
            state: directory
            mode: '755'
            recurse: true
          when: agent_install_check.rc == 0

        - name: Backup old agent to backup folder
          community.general.archive:
            path: "{{ agent_path }}/"
            dest: "{{ php_agent_backup_folder_linux }}/agent.{{ ansible_date_time.iso8601 }}_{{ current_agent_version.stdout_lines[0] }}.zip"
            mode: '755'
          register: backup_zip_check
          changed_when: false

        - name: Setting flag for backup success
          ansible.builtin.set_fact:
            is_backup_done: true
          when: not backup_zip_check.failed

  rescue:
    - name: Error occured while doing backup task
      ansible.builtin.debug:
        msg: 'Error occured while doing backup task failed at - {{ ansible_failed_task.name }}'

    - name: Setting flag for backup failure
      ansible.builtin.set_fact:
        is_backup_done: false

    - name: Failing rest of the parent tasks
      ansible.builtin.fail:
        msg: "Failed in backup due to {{ ansible_failed_task.name }}"