---

- name: Pre-Task for Target debian instances
  become: True
  when: not zts_support and ansible_os_family == 'Debian'
  block:
    - name: Update apt cache (on Debian).
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Curl
      package:
        name: 
          - curl
          - jq

    - name: Installation of software-properties-common
      apt: "name={{item}}"
      with_items:
        - "software-properties-common"
        - "gpg-agent"
        - "git"

    - name: Add PHP PPA repository
      apt_repository:
        repo: ppa:ondrej/php
        state: present
        update_cache: yes
      
    - name: "Updating the repo"
      apt: update_cache=yes

    - name: Install PHP 7.2 and related packages
      apt:
        name:
          - php7.2
          - php7.2-cli
          - php7.2-mysql
          - php7.2-gd
          - php7.2-curl
        state: present

- name: Pre-Task for Target redhat instances
  become: True
  when: not zts_support and ansible_os_family == 'RedHat'
  block:
    - name: php add repo
      command: "rpm -Uvh https://mirror.webtatic.com/yum/el7/webtatic-release.rpm"

    - name: Install PHP 7.2 packages
      command: "yum install php72w php72w-cli php72w-common php72w-devel php72w-gd php72w-mbstring php72w-mysql php72w-pdo php72w-xml -y"
