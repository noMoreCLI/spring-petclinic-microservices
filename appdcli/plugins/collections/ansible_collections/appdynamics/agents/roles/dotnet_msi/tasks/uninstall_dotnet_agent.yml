- name: Check if .Net Agent MSI is installed
  ansible.windows.win_shell: 'get-wmiobject Win32_Product | Where{$_.Name -eq "AppDynamics .NET Agent"} | Select -First 1 -ExpandProperty IdentifyingNumber'
  register: is_agent_installed
  changed_when: false

- name: Uninstall .Net Agent MSI
  when: is_agent_installed.stdout | length != 0
  block:
    - name: Get .Net Agent MSI installation id
      ansible.builtin.set_fact:
        agent_product_id: "{{ is_agent_installed.stdout | regex_replace('\\r\\n', '') }}"

    - name: Print .NET Agent MSI installation id
      ansible.builtin.debug:
        msg: "{{ agent_product_id }}"

    #do not backup if uninstalling during the rollback
    - name: Backup current .Net Agent MSI
      ansible.builtin.include_tasks: backup_dotnet_agent.yml
      when: agent_action | lower != rollback_string

    - name: Ensure .Net Agent MSI temp directory exists
      ansible.windows.win_file:
        path: "{{ dotnet_agent_dest_folder_win }}\\"
        state: directory

    - name: Uninstall .Net Agent MSI package
      ansible.windows.win_package:
        product_id: "{{ agent_product_id }}"
        log_path: "{{ dotnet_agent_dest_folder_win }}/UninstallLogs.txt"
        state: absent
      notify:
        - Restart app listener
      tags: molecule-idempotence-notest
  rescue:
    - name: Set .Net Agent MSI Result Fact
      ansible.builtin.set_fact:
        appdynamics_agent_result:
          app: null
          tier: null
          node: null
          error: true
          install_path: null
          agent_type: '{{ agent_type }}'
          agent_version: '{{ dotnet_msi_agent_version }}'
          action: '{{ agent_action }}'

    - name: appdynamics.agent.result
      ansible.builtin.debug:
        msg: '{{ appdynamics_agent_result | to_json }}'

    - name: Get Uninstall logs
      ansible.windows.win_shell: 'Get-Content {{ dotnet_agent_dest_folder_win }}/UninstallLogs.txt -Tail 30'
      register: uninstall_logs

    - name: Fail
      ansible.builtin.fail:
        msg:
        - Failed to uninstall .Net Agent MSI
        - "{{ uninstall_logs.stdout | regex_replace('\\r\\n', '') }}"

# cleanup Agent configuration and log files if uninstall action is requested (and keep them if uninstallation is a part of upgrade)
- name: "Cleanup after .Net Agent MSI uninstall"
  when: agent_action | lower == uninstall_string
  block:
    - name: Set .Net Agent MSI Result Fact
      ansible.builtin.set_fact:
        appdynamics_agent_result:
          app: null
          tier: null
          node: null
          error: false
          install_path: null
          agent_type: '{{ agent_type }}'
          agent_version: null
          action: '{{ agent_action }}'

    - name: appdynamics.agent.result
      ansible.builtin.debug:
        msg: '{{ appdynamics_agent_result | to_json }}'

    - name: "Cleanup {{ INSTALL_DIR }}"
      ansible.windows.win_file:
        path: "{{ INSTALL_DIR }}"
        state: absent

    - name: "Cleanup {{ DOTNETAGENT_DIR }}"
      ansible.windows.win_file:
        path: "{{ DOTNETAGENT_DIR }}"
        state: absent
