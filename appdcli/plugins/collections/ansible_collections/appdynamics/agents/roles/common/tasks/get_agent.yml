---
# Initialize the qualified_agent_type
# This allows a generic agent type to be used, rather than an OS specific one
# We set the OS specific agent type based on the base type and os family
- name: Reassign agent_type var to an OS qualified_agent_type fact
  ansible.builtin.set_fact:
    qualified_agent_type: "{{ agent_type }}"

# Override the agent type for the DB agent on Window. The windows package
# includes scripts to install the agent as a service.
- name: Adjust the DB agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "db-win"
  when: ansible_os_family == 'Windows' and agent_type == 'db'

# Override the agent type for the iib agent on AIX. 
# includes scripts to install the agent as a service.
- name: Adjust the IIB agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "iib-aix"
  when: ansible_os_family == 'AIX' and agent_type == 'iib'

# Override the agent type for the Machine agent on Window. The windows package
# includes scripts to install the agent as a service.
- name: Adjust the Machine agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "machine-win"
  when: ansible_os_family == 'Windows' and agent_type == 'machine'

- name: Adjust the Machine agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "machine-solaris-sparcv9"
  when: ansible_os_family == 'Solaris' and (ansible_architecture == 'sun4v' or ansible_architecture == 'sparc')  and agent_type == 'machine'

- name: Adjust the Machine agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "machine-solaris"
  when: ansible_os_family == 'Solaris' and (ansible_architecture == 'x86_64' or ansible_architecture == 'x64') and agent_type == 'machine'

- name: Adjust the Machine agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "machine-aix"
  when: ansible_os_family == 'AIX' and agent_type == 'machine'

# Override the agent type for the PHP Agent for NTS. 
- name: Adjust the php agent type to match the target OS without ZTS
  ansible.builtin.set_fact:
    qualified_agent_type: "php-tar"
  when: agent_type == 'php' and (ansible_os_family == 'RedHat' or ansible_os_family == 'Debian') and not zts_support

# Override the agent type for the PHP Agent for ZTS. 
- name: Adjust the php agent type to match the target OS with ZTS
  ansible.builtin.set_fact:
    qualified_agent_type: "php-zts-tar"
  when: agent_type == 'php' and (ansible_os_family == 'RedHat' or ansible_os_family == 'Debian') and zts_support

- name: Adjust the Python agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "python-alpine"
  when: ansible_os_family == 'Alpine' and agent_type == 'python'

- name: Adjust the apache agent type to match the target OS
  ansible.builtin.set_fact:
    qualified_agent_type: "apache-i386"
  when: agent_type == 'apache' and ( ansible_os_family == 'RedHat' or ansible_os_family == 'Debian' ) and (ansible_userspace_architecture == 'i386')

- name: Get AppDynamics Agent Download URL (sh)
  ansible.builtin.command: >
    {{ role_path }}/files/get-agent.sh download {{ qualified_agent_type }} -v {{ agent_version }} --dryrun
  register: agent_download_url_sh
  delegate_to: localhost
  failed_when:
    (agent_download_url_sh.rc != 0) or 
    (agent_download_url_sh.stdout is not search("https://download-files.appdynamics.com/download-file/")) or
    (download_script not in ['sh', 'py'])
  changed_when: false
  when: download_script == 'sh'

- name: Get AppDynamics Agent Download URL (module)
  appd_get_agent:
    agent: "{{ qualified_agent_type }}"
    version: "{{ agent_version }}"
    dryrun: true
  register: agent_download_url_mod
  delegate_to: localhost
  failed_when:
    (agent_download_url_mod.result is not search("https://download-files.appdynamics.com/download-file/")) or
    (download_script not in ['sh', 'py'])
  changed_when: false
  when: download_script == 'py'

- name: print agent_location fact
  debug:
    msg: >-
      {% if download_script == 'sh' %}
        "(sh) download -> {{ agent_download_url_sh.stdout }}"
      {% elif download_script == 'py' %}
        "(module) download -> {{ agent_download_url_mod.result }}"
      {% endif %}

- name: Set agent_location fact
  ansible.builtin.set_fact:
    agent_location: >-
      {% if download_script == 'sh' %}
        {{ agent_download_url_sh.stdout }}
      {% elif download_script == 'py' %}
        {{ agent_download_url_mod.result }}
      {% endif %}

- name: set fact download_agent_version
  ansible.builtin.set_fact:
    download_agent_version: "{{ agent_location.split('/')[-2] }}"

- ansible.builtin.debug:
   msg: "{{ agent_type }} agent (OS specific agent name: {{ qualified_agent_type }}) Download URL = {{ agent_location }}  with Agent Version :- {{ download_agent_version }}"