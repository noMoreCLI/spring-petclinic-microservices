- name: Agent uninstall block
  become: true
  block:
    - name: Check backup directory
      ansible.builtin.stat:
        path: "{{ iib_agent_backup_folder }}"
      register: backup_dir

    - name: Delete backup folder
      ansible.builtin.file:
        path: "{{ iib_agent_backup_folder }}"
        state: absent
      when: backup_dir.stat.exists and not keep_backup
      changed_when: false

    - name: Clean up old agent
      ansible.builtin.file:
        path: "{{ agent_path }}"
        state: absent
      changed_when: false # this ensures this task is idempotent

    # remove the ansible installed agent type from environment variable containing list
    - name: Remove appdynamics installation type environment variable
      ansible.builtin.include_role:
        name: common
        tasks_from: remove_installation_env_var

    - name: Notifying Agent State to Handler
      ansible.builtin.debug:
        msg: "Notifying handler for successful Agent uninstall"
      changed_when: true
      notify: "Verify iib agent state"
  rescue:
    - name: Setting error status
      ansible.builtin.set_fact:
        error_status: true

    - name: Printing to output file as error occurred while doing Agent uninstall
      ansible.builtin.debug:
        msg: 'Error occurred while doing Agent uninstall. Task failed - {{ ansible_failed_task.name }}'
