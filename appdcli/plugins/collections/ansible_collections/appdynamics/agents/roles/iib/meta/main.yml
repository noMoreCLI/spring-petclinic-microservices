---
galaxy_info:
  author: Narasimha Gonapa (https://galaxy.ansible.com/ngonapa)
  role_name: iib
  company: AppDynamics
  description: This role installs and configures the AppDynamics IIB Agent
  license: Apache2
  min_ansible_version: "2.9"
  platforms:
    - name: Ubuntu
      versions:
        - precise
        - quantal
        - raring
        - saucy
        - trusty
        - xenial
        - artful
        - bionic
    - name: AIX
      versions:
        - "7.1"
        - "7.2"

  galaxy_tags:
    - apm
    - monitoring
    - appdynamics

dependencies:
  - { role: common }
  - { role: linux_pkg, when: ansible_os_family == 'RedHat' or  ansible_os_family == 'AIX' }
