- name: Agent Directory Cleanup block
  become: "{{ run_with_root }}"
  block:
    - name: Collect files in Directory
      ansible.builtin.find:
        paths: "{{ dir.path }}"
        recurse: true
      register: collected_files

    - name: Remove collected files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ collected_files.files }}"
      when: collected_files.files | count > 0
      changed_when: false
