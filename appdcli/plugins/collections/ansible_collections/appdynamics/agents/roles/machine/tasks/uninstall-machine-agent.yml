- become: true
  when: ansible_os_family == 'AIX'
  block:
    - name: Clean up old Machine Agent binaries from dest folder
      ansible.builtin.file:
        path: "{{ machine_agent_dest_folder_linux }}"
        state: absent
      changed_when: false
    - name: Set the Installation path fact
      ansible.builtin.set_fact:
