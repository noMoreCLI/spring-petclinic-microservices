---
agent_dir_permission:
  user: "{{ appdynamics_user }}"
  group: "{{ appdynamics_group }}"

apache_agent_dest_file: "apache-agent.tgz"
agent_path: "{{ linux_custom_agent_install_path | default(apache_agent_dest_folder) }}"
# defaults file for apache_agent
apache_conf_path: "{{ '/etc/httpd/conf/httpd.conf' if ansible_os_family == 'RedHat' else '/etc/apache2/apache2.conf' }}"
apache_env_path_debain: "/etc/apache2/envvars"
appdynamics_proxy_comm_dir: "{{ apache_agent_dest_folder }}/appdynamics-sdk-native/logs/appd-sdk"
install_action: ['{{ install_string }}', '{{ upgrade_string }}']
libzmq_version_23x: 'libzmq.so.5'
libzmq_version_22x: 'libzmq.so.3'
default_libcrypt_file_path: '/usr/lib/x86_64-linux-gnu/libcrypt.so.1'
libcrypt_file_name: "libcrypt.so.2"

# Error flag
error_status: false