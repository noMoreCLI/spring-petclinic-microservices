- ansible.builtin.debug:
    msg: "Fetching Machine Agent located at {{ agent_location }} through {{ download_protocol }} transfer"

- ansible.builtin.include_role:
    name: appdynamics.agents.fetch_agent
  vars:
    agent_destination_path: '{{ machine_agent_dest_folder_win }}/{{ ma_agent_dest_file }}'
    agent_source_location: '{{ agent_location }}'
    fetch_protocol: '{{ agent_download_protocol }}'

- name: Unzip machine agent file
  community.windows.win_unzip:
    src: '{{ machine_agent_dest_folder_win }}/{{ ma_agent_dest_file }}'
    dest: '{{ machine_agent_dest_folder_win }}'
    remote_src: yes
  changed_when: false

- when: (machine_agent_backup_config_folder is defined and machine_agent_backup_config_folder | length > 0)
  block:
    - ansible.windows.win_stat:
        path: "{{ machine_agent_backup_config_folder }}/conf"
      register: backup_conf_folder

    - ansible.windows.win_stat:
        path: "{{ machine_agent_backup_config_folder }}/monitors"
      register: backup_monitors_folder


    - name: Retrieve agent configs of previous agent
      ansible.windows.win_copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
      changed_when: false
      with_items:
        - { filename: "{{ backup_conf_folder }}", src: "{{ machine_agent_backup_config_folder }}/conf",
            dest: "{{ machine_agent_dest_folder_win }}/" }
        - { filename: "{{ backup_monitors_folder }}", src: "{{ machine_agent_backup_config_folder }}/monitors",
            dest: "{{ machine_agent_dest_folder_win }}/" }

      when: (item.filename).stat.exists
      loop_control:
        label: "{{ item.src }}"

    - name: Merging controller-info.xml with args.yaml
      ansible.builtin.include_tasks: merging-controller-info.yml

- name: Agent config generation in case of Fresh install
  when: not previous_agent.stat.exists
  block:
    - name: Configure machine-agent controller-info.xml
      ansible.builtin.template:
        src: templates/win-machine-agent-controller-info.xml.j2
        dest: '{{ machine_agent_dest_folder_win }}/conf/controller-info.xml'
        force: yes
      changed_when: false

- name: Remove StdIn.Read in the InstallService.vbs file which stops the playbook from returning
  community.windows.win_lineinfile:
    dest: '{{ machine_agent_dest_folder_win }}/InstallService.vbs'
    regexp: "^WScript.StdIn.Read"
    state: absent
  register: remove_read_std_in_result
  changed_when: false

# Update the Log4j setting to apply the desired log level to all the loggers
# listed in the {{agent_loggers}} list.
- name: Set the log level on the agent (if != info, which it is by default)
  ansible.builtin.include_role:
    name: logger
  vars:
    logger_role_standalone: false # no need to check if the dir exists
  when: agent_log_level|lower != 'info'


- ansible.builtin.include_tasks: configure_log_analytics_win.yml
  when: enable_analytics_agent | bool

- name: 'Install machine agent service'
  ansible.windows.win_command: "cscript.exe {{ machine_agent_dest_folder_win }}/InstallService.vbs {{ java_system_properties }}"
  register: install_win_service_result
  changed_when: false
  when: autostart_agent | bool

- name: Install service result
  ansible.builtin.debug:
    var: install_win_service_result
  when: autostart_agent | bool

- name: Clean up - remove {{ ma_agent_dest_file }}
  ansible.windows.win_file:
    path: "{{ machine_agent_dest_folder_win }}/{{ ma_agent_dest_file }}"
    state: absent
  changed_when: false