- ansible.builtin.debug:
    msg: "Fetching Machine Agent located at {{ agent_location }} through {{ download_protocol }} transfer"

- ansible.builtin.include_role:
    name: appdynamics.agents.fetch_agent
  vars:
    agent_destination_path: '{{ machine_agent_dest_folder_linux }}/{{ ma_agent_dest_file }}'
    agent_source_location: '{{ agent_location }}'
    fetch_protocol: '{{ agent_download_protocol }}'
- name: Unzip the Machine agent file
  ansible.builtin.unarchive:
    src:  "{{ machine_agent_dest_folder_linux }}/{{ ma_agent_dest_file }}"
    dest: "{{ machine_agent_dest_folder_linux }}"
    owner: "{{ appdynamics_user }}"
    group: "{{ appdynamics_group }}"
    mode: 0755
    remote_src: yes
  changed_when: false

- when: (machine_agent_backup_config_folder is defined and machine_agent_backup_config_folder | length > 0)
  block:
    - ansible.builtin.stat:
        path: "{{ machine_agent_backup_config_folder }}/conf"
      register: backup_conf_folder

    - ansible.builtin.stat:
        path: "{{ machine_agent_backup_config_folder }}/monitors"
      register: backup_monitors_folder


    - name: Retrieve Machine agent config of previous agent
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        owner: "{{ appdynamics_user }}"
        group: "{{ appdynamics_group }}"
        mode: 0755
        remote_src: true
      changed_when: false
      with_items:
        - { filename: "{{ backup_conf_folder }}", src: "{{ machine_agent_backup_config_folder }}/conf",
            dest: "{{ machine_agent_dest_folder_linux }}/" }
        - { filename: "{{ backup_monitors_folder }}", src: "{{ machine_agent_backup_config_folder }}/monitors",
            dest: "{{ machine_agent_dest_folder_linux }}/" }
      when: (item.filename).stat.exists
      loop_control:
        label: "{{ item.src }}"

    - name: Merging controller-info.xml with args.yaml
      ansible.builtin.include_tasks: merging-controller-info.yml

- name: Machine Agent config generation in case of Fresh install
  when: not previous_agent.stat.exists
  block:
    - name: Configure Machine Agent controller-info.xml file
      ansible.builtin.template:
        src: templates/machine-agent-controller-info.xml.j2
        dest: '{{ machine_agent_dest_folder_linux }}/conf/controller-info.xml'
        owner: "{{ appdynamics_user }}"
        group: "{{ appdynamics_group }}"
        mode: 0755
      changed_when: false

# Update the Log4j setting to apply the desired log level to all the loggers
# listed in the {{agent_loggers}} list.
- name: Set the log level on the agent (if != info, which it is by default)
  ansible.builtin.include_role:
    name: logger
  vars:
    logger_role_standalone: false # no need to check if the dir exists
  when: agent_log_level|lower != 'info'

- name: Ensure machine agent file is executable
  ansible.builtin.file:
    path: "{{ machine_agent_dest_folder_linux }}/bin/machine-agent"
    mode: 0755

- ansible.builtin.include_tasks: configure_log_analytics_linux.yml
  when: enable_analytics_agent | bool

- name: Add the Agent as a Service using Systemd
  ansible.builtin.template:
    src: templates/appdynamics-machine-agent.service.j2
    dest: /etc/systemd/system/appdynamics-machine-agent.service
    force: true
    owner: "{{ appdynamics_user }}"
    group: "{{ appdynamics_group }}"
    mode: 0644
  register: machine_agent_systemd_result
  when: autostart_agent | bool

- name: Enable the Machine Agent to start at system startup
  ansible.builtin.systemd:
    name: appdynamics-machine-agent
    enabled: yes
    force: true # Force it to override existing symlink incase of an upgrade
    masked: no
  when: autostart_agent | bool

#Reload systemd if it is an upgrade or re-installation
- name:  Reload systemd configs
  ansible.builtin.systemd:
    daemon_reload: yes
  when: autostart_agent | bool and previous_agent.stat.exists

- name: Start the agent service
  ansible.builtin.systemd:
    name: appdynamics-machine-agent
    state: restarted
    daemon_reload: yes
  changed_when: false
  when: autostart_agent | bool

- name: Make sure the service is running
  ansible.builtin.command: systemctl status appdynamics-machine-agent
  register: result
  ignore_errors: yes
  changed_when: false
  when: autostart_agent | bool

- name: Show Machine Agent status
  ansible.builtin.debug:
    var: result
  when: autostart_agent | bool

- name: Clean up - remove {{ ma_agent_dest_file }}
  ansible.builtin.file:
    path: "{{ machine_agent_dest_folder_linux }}/{{ ma_agent_dest_file }}"
    state: absent
  changed_when: false