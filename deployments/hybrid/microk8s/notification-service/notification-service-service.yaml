apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: default-addresspool
    metallb.universe.tf/allow-shared-ip: "cl25us"
    kompose.cmd: kompose -f docker-compose.yml convert
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: notification-service
  name: notification-service
spec:
  ports:
    - name: "8089"
      port: 8089
      targetPort: 8089
  type: LoadBalancer
  selector:
    io.kompose.service: notification-service