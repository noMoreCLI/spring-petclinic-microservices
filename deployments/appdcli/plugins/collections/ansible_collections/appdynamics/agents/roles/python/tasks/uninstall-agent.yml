- name: Uninstall Agent
  become: "{{ run_with_root }}"
  block:
    - name: Check if agent installed in system
      ansible.builtin.shell: "{{ python_path }} freeze | grep appdynamics"
      register: old_agent_found
      ignore_errors: true
      changed_when: false
      failed_when: old_agent_found.rc > 1

    - name: Uninstalling agent
      when: old_agent_found.rc == 0
      block:
        - name: Saving appdynamics library names in temporary file
          ansible.builtin.shell: "{{ python_path }} freeze | sed -n -e '/^appdynamics/p' > /tmp/installed_python_agents.txt"
          changed_when: false

        - name: Uninstalling agent
          ansible.builtin.shell: "{{ python_path }}  uninstall -r /tmp/installed_python_agents.txt -y"
          changed_when: false

        - name: Removing temporary file
          ansible.builtin.file:
            path: "/tmp/installed_python_agents.txt"
            state: absent

    - name: Remove appdynamics installation type environment variable
      ansible.builtin.include_role:
        name: common
        tasks_from: remove_installation_env_var

    - name: Deleting current python agent
      ansible.builtin.file:
        path: "{{ python_agent_dest_folder }}"
        state: absent
      changed_when: false

    - name: Deleting python agent backup
      ansible.builtin.file:
        path: "{{ python_agent_backup_folder }}"
        state: absent
      changed_when: false
      when: not keep_backup

    - name: Notifying Agent State to Handler
      ansible.builtin.debug:
        msg: "Notifying handler for successful Agent uninstall"
      changed_when: true
      notify: "Verify python agent state"

  rescue:
    - name: Setting error status
      ansible.builtin.set_fact:
        error_status: true

    - name: Notifying Agent State to Handler
      ansible.builtin.debug:
        msg: "Notifying handler as Exception occurred"
      changed_when: true
      notify: "Set Exception Logs"

    - name: Printing to output file as error occurred while doing Agent uninstall
      ansible.builtin.debug:
        msg: "Error occurred while doing Agent uninstall. Task failed - {{ ansible_failed_task.name }}"
