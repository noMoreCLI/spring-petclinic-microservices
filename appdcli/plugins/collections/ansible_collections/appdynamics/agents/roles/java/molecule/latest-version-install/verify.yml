---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Get Latest version
      ansible.builtin.shell: 'curl --location --http1.0 --silent  https://download.appdynamics.com/download/latest/ | jq -r "first(.[]  | select(.s3_path | test(\"java-jdk8\"))) | .version"'
      register: latest_version
    - set_fact:
        controller_info_verifier: 'lncontroller20103-2010-o8evv8rp'
        agent_version: "{{ latest_version.stdout }}"
    - name: Agent installation verification
      block:
        - name: Check if Agent File present
          stat:
            path: "/opt/appdynamics/java-agent/javaagent.jar"
          register: agent_found

        - name: Assert that Agent file found
          assert:
            that:
              - agent_found.stat.exists
            success_msg: "Agent Found in Destination"
            fail_msg: "Agent Not Found in Destination. Check Failed"

        - name: Find agent version directory
          find:
            path: "/opt/appdynamics/java-agent"
            patterns: 'ver*'
            file_type: directory
          register: versionfiles
        - name: Assert that right Agent Version installed
          assert:
            that:
              - versionfiles.files[0].path is search("{{agent_version}}")