---
- hosts: all
  tasks:
    - include_role:
        name: appdynamics.agents.java
      vars:
        agent_version: 22.6.0
        agent_type: sun-java
        agent_action: install
        application_name: app
        tier_name: tier
        node_name: node
        controller_host_name: "random-controller"
        controller_port: "8090"
        controller_account_name: "random-customer"
        controller_account_access_key: "random-access-key"

  pre_tasks:
    - include_tasks:
        file: pre-task.yml