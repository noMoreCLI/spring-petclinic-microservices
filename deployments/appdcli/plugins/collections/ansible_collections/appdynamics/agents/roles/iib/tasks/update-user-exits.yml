- name: Update User Exit file
  become: true
  block:
    - name: Check if Config File exists
      ansible.builtin.stat:
        path: "{{ file_path }}"
      register: config_status

    - when: config_status.stat.exists
      block:
        - name: Read existing Config YAML file
          ansible.builtin.slurp:
            src: "{{ file_path }}"
          register: yaml_file_content
          failed_when: false

        - name: Update UserExits section in YAML file
          when: "'UserExits:' in yaml_file_content.content | b64decode"
          ansible.builtin.replace:
            path: "{{ file_path }}"
            regexp: '(?s)UserExits:.*?\n\n'
            replace: |
              UserExits:
                activeUserExitList: "{{ iib_user_exit }}"
                userExitPath: "{{ agent_path }}/appdynamics/"
              \n
  rescue:
    - name: Setting error status
      ansible.builtin.set_fact:
        error_status: true

    - name: Error Updating IIB Config UserExits
      ansible.builtin.debug:
        msg: 'Error occurred while updating IIB Config UserExits for file {{ file_path }}. Task Failed - {{ ansible_failed_task.name }}'
