apiVersion: batch/v1
kind: CronJob
metadata:
  name: petclinic-sim
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: petclinic-sim-cronjob
            image: marciokugler/petclinic-sim:latest
            imagePullPolicy: IfNotPresent
          restartPolicy: OnFailure