---
- name: Agent install status report
  become: true
  block:
    - name: Verify is agent is installed in php modules
      ansible.builtin.shell: "{{ php_path }} -m | grep appdynamics_agent"
      register: agent_module_check
      changed_when: false
      ignore_errors: true

    - name: Verify if php ini file is configured successfully
      ansible.builtin.shell: "{{ php_path }} -i | grep 'Loaded Configuration File' | awk '{print $NF}' | xargs dirname | xargs -I{} find {} -name {{ ini_file_name }}"
      register: config_path
      changed_when: false
      ignore_errors: true
    
    - name: Run php command and filter output
      ansible.builtin.shell: "{{ php_path }} -r 'foreach (get_loaded_extensions() as $extension) echo \"$extension: \" . phpversion($extension) . \"\\n\";' | grep appdynamics_agent"
      register: php_output
      changed_when: false
      check_mode: no

    - name: Register agent version number
      ansible.builtin.shell: "echo {{ php_output.stdout }} | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+'"
      changed_when: false
      register: agent_version

    - name: Find backed up agent files from backup dir
      ansible.builtin.find:
        path: "{{ php_agent_backup_folder_linux }}"
        patterns: 'agent*'
      register: backup_files

    - name: Set backup count
      ansible.builtin.set_fact:
        agentfiles: "{{ backup_files.files if backup_files is defined else [] }}"
    
    - name: Check if config is maintained in agent Directory
      ansible.builtin.stat:
        path: "{{ agent_path }}/{{ agent_config_file }}"
      register: agent_config_check
      failed_when: not agent_config_check.stat.exists

    - name: Cat the INI file
      ansible.builtin.shell: "cat {{ config_path.stdout_lines[0] }}"
      changed_when: false
      register: config_file

    - name: Setting config specs to dict
      ansible.builtin.set_fact: 
        config_dict: "{{ config_dict | default({}) | combine({item.split('=')[0].strip(): item.split('=')[1].strip()}) }}"
      with_items: "{{ config_file.stdout_lines[1:] }}" # skipping the first index since it would be the section of ini file
    
    - name: Set config status dict
      ansible.builtin.set_fact:
        config:
          application: "{{ config_dict['agent.applicationName'] | default('') }}"
          tier: "{{ config_dict['agent.tierName'] | default('') }}"
          node: "{{ config_dict['agent.nodeName'] | default('') }}"
          controller_host_name: "{{ config_dict['agent.controller.hostName'] | default('') }}"
          controller_port: "{{ config_dict['agent.controller.port'] | default('') }}"

    - name: Transform Playbook run information to standard format
      ansible.builtin.set_fact:
        run_info:
          playbook_run_summary: "This Run was related to Agent {{ agent_action }}"
          current_agent_version_on_target: "{{ agent_version }}"
          backup_count_on_target: "{{ agentfiles | count }}"
          zts_support: "{{ zts_support }}"
          backup_path: "{{ php_agent_backup_folder_linux }}"
          agent_path: "{{ agent_path }}"
          config_info: "{{ config if config is defined else {} }}"
    
    - name: Print Run information
      ansible.builtin.debug:
        msg: "{{ run_info }}"

    - name: appdynamics_agent_status php
      ansible.builtin.debug:
        msg: "{{ run_info | to_nice_json }}"