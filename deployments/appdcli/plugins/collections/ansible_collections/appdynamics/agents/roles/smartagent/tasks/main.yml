- block:
    - name: Autogenerate appdynamics facts
      when: ( ansible_os_family == 'Debian' or ansible_os_family == 'RedHat' or ansible_os_family == 'Suse')
      appdynamics.agents.appd_facts:
      register: appd

    - name: appdynamics_agent_status Output Failed Status
      ansible.builtin.set_fact:
        smartagent_auto_start: "{{ smartagent_auto_start }}"

    - name: Install Agent and update config
      when: (agent_action|lower == install_string)
      block:
        - ansible.builtin.include_tasks: install-smartagent.yml

    - name: Uninstall Agent and update config
      when: (agent_action|lower == uninstall_string)
      block:
        - ansible.builtin.include_tasks: uninstall-smartagent.yml

    - name: Upgrade Agent and update config
      when: (agent_action|lower == upgrade_string)
      block:
        - ansible.builtin.include_tasks: uninstall-smartagent.yml
        - ansible.builtin.include_tasks: install-smartagent.yml
          vars:
            smartagent_auto_start: true
    - name: Configure Smart Agent (LD_Preload)
      when: ( ansible_os_family != 'Windows' and (agent_action|lower == configure_string))
      block:
        - ansible.builtin.include_tasks: configure.yml
