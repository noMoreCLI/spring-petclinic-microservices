galaxy_info:
  author: appdynamics
  role_name: php
  description: This role installs and configures the AppDynamics Php Agent
  company: AppDynamics
  license: Apache2
  min_ansible_version: "2.9"
  platforms:
    - name: Ubuntu
      versions:
        - precise
        - quantal
        - raring
        - saucy
        - trusty
        - xenial
        - artful
        - bionic
    - name: Debian
      versions:
        - wheezy
        - jessie
        - stretch
        - buster
  galaxy_tags:
    - apm
    - monitoring
    - appdynamics

dependencies:
  - { role: common }
  - { role: linux_pkg, when: "ansible_os_family == 'RedHat' or  ansible_os_family == 'Debian'"}
