- name: Define supported OS families and architectures
  set_fact:
    supported_os_families: [ 'RedHat', 'Debian', 'Suse', 'Windows', 'Solaris', 'AIX', 'Alpine' ]
    supported_solaris_architectures: [ 'x86_64', 'x64', 'sun4v', 'sparc' ]
    architecture_matched: "True" # Default true for OS families without specific architecture checks

- name: Check if OS family is supported
  set_fact:
    os_family_matched: "{{ ansible_os_family in supported_os_families }}"

- name: Check if architecture is supported for Solaris
  set_fact:
    architecture_matched: "{{ ansible_architecture in supported_solaris_architectures }}"
  when: ansible_os_family == 'Solaris'

- block:
    - name: Validate OS family and architecture compatibility
      fail:
        msg: "The requested OS family '{{ ansible_os_family }}' or architecture '{{ ansible_architecture }}' is not supported"
      when: not os_family_matched or not architecture_matched

  rescue:
    - name: appdynamics_agent_status Output Failed Status
      ansible.builtin.set_fact:
        machine_playbook_failed: true
    - name: Halt playbook execution due to unsupported system configuration
      fail:
        msg: "The playbook execution has been halted because the target system uses an unsupported OS family or architecture."

