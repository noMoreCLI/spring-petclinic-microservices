- name: Create Agent Config
  block:
    - name: appdynamics_agent_status Adding new Agent config
      ansible.builtin.template:
        src: templates/appdynamics-node-agent.j2
        dest: "{{ node_agent_dest_folder }}/appd-config.js"
        force: true
        mode: 0755
      become: true
      register: node_agent_config  # use this to check if this state was successful in case of rollback
  rescue:
    - name: appdynamics_agent_status Printing to output file as error occurred while Adding Agent Config
      ansible.builtin.debug:
         msg: 'Error occurred while Adding agent config. Error: {{ ansible_failed_task.name }}'