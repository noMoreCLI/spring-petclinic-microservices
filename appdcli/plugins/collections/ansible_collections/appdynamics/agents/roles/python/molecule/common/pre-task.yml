---

- name: Pre-Task for Target instances
  block:
    - name: Update apt cache (on Debian).
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Install Curl and Jq
      package:
        name: 
          - curl
          - jq
          

    - name: Python Status
      shell: "python3 --version"
      register: python_status
      ignore_errors: True

    - name: Install Python3
      package:
        name: python3
      when: python_status.rc != 0

    - name: Pip Status
      shell: "pip3 --version"
      register: pip_status
      ignore_errors: True

    - name: Install Pip incase not present (RedHat, Debian)
      package:
        name: python3-pip
      when: pip_status != 0 and ansible_os_family in ['Debian', 'RedHat']
    
    - name: Install Pip incase not present Alpine
      package:
        name: py3-pip
      when: pip_status != 0 and ansible_os_family  == "Alpine"
