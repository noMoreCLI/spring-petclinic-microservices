---
# App owners would either need to chown the entire agent folder to their app's user OR grant their app's user read/write access to the agent folder
- name: Java Linux Block
  become: true
  block:
    - ansible.builtin.set_fact:
        backup_done_if_needed: false

    - name: Set the Installation path fact
      ansible.builtin.set_fact:
        java_agent_dest_folder: "{{ java_agent_install_path_linux }}"
    - ansible.builtin.debug:
        msg:
          - "Install directory path set to {{ java_agent_dest_folder }}"
          - "Backup directory path set to {{ java_agent_backup_folder_linux }}"

    - name: AppD facts
      appd_facts:
         strategy: java
         path: "{{ java_agent_install_path_linux }}"
      register: appd

    - debug:
         msg: "appd facts || path={{ java_agent_install_path_linux }} 
         app={{ application_name if (application_name is defined) and (application_name|length >0) else appd.ansible_facts.appdynamics.app }} 
         tier={{ tier_name if (tier_name is defined) and (tier_name|length > 0) else appd.ansible_facts.appdynamics.tier }} 
         node={{ node_name if (node_name is defined) and (node_name|length > 0) else appd.ansible_facts.appdynamics.node }}"

    - name: Ensures agent backup dir exists
      ansible.builtin.file:
        path: "{{ java_agent_backup_folder_linux }}/"
        state: directory
        mode: 0755
        recurse: yes
      changed_when: false # this ensures this task is idempotent

    - name: If doing a rollback, check that backup exists
      ansible.builtin.include_tasks: rollback_check_backup_exists.yml
      when: (agent_action|lower == rollback_string)

    - name: Check if java agent already exists
      ansible.builtin.stat:
        path: "{{ java_agent_dest_folder }}/javaagent.jar"
      register: previous_agent

    - name: Find old agent version directory
      ansible.builtin.find:
        path: "{{ java_agent_dest_folder }}/"
        patterns: 'ver*'
        file_type: directory
      register: versionfile
      when: previous_agent.stat.exists

    - ansible.builtin.set_fact:
        java_agent_already_exists: "{{ previous_agent.stat.exists and versionfile.files | count != 0 }}"

    - ansible.builtin.debug:
        msg:
          - "Does Java agent already exists in install path - {{ java_agent_already_exists }}."
          - "Take agent backup before upgrading. Maximum no. of allowed backups set to {{ max_agent_backup_count }}."

    - ansible.builtin.fail:
        msg: "WARNING- Max backup count set to 0. No backup will be created for restoring agent in future."
      ignore_errors: true
      when: max_agent_backup_count == 0

    - name: Backup task, if previous agent exists
      when: java_agent_already_exists
      block:
        - name: Clean out orphanned {{ java_agent_dest_file }}
          ansible.builtin.file:
            path: "{{ java_agent_dest_folder }}/{{ java_agent_dest_file }}"
            state: absent
          changed_when: false # this ensures this task is idempotent

        - name: Get the version of existing agent
          ansible.builtin.set_fact:
            backup_version: "{{ (versionfile.files[0].path | basename).split('ver').1 }}"

        - ansible.builtin.debug:
            msg: "Java Agent with {{ backup_version }} version found."

        - name: Set agent backup file name
          ansible.builtin.set_fact:
            java_agent_backup_file_path: "{{ java_agent_backup_folder_linux }}/agent.{{ ansible_date_time.iso8601 }}_{{ backup_version }}.zip"

        - ansible.builtin.set_fact: #save config in backup folder for using them later during install
            java_agent_backup_config_folder: "{{ java_agent_backup_folder_linux }}/config_{{ backup_version }}"

        - ansible.builtin.stat:
            path: "{{ java_agent_dest_folder }}/conf"
          register: old_conf_folder
        - ansible.builtin.stat:
            path: "{{ java_agent_dest_folder }}/ver{{ backup_version }}/conf"
          register: old_ver_conf_folder
        - ansible.builtin.stat:
            path: "{{ java_agent_dest_folder }}/ver{{ backup_version }}/logs"
          register: old_logs_folder

        - name: Save existing agent configs to retain them in newly installed agent
          ansible.builtin.copy:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: 0755
            remote_src: true
          changed_when: false
          with_items:
            - { filename: "{{ old_conf_folder }}", src: "{{ java_agent_dest_folder }}/conf",
                dest: "{{ java_agent_backup_config_folder }}/" }
            - { filename: "{{ old_ver_conf_folder }}", src: "{{ java_agent_dest_folder }}/ver{{ backup_version }}/conf",
                dest: "{{ java_agent_backup_config_folder }}/ver/" }
          when: (item.filename).stat.exists and (agent_action|lower != rollback_string)  #don't retain conf folder during rollback
          loop_control:
            label: "{{ item.src }}"

        - name: Save existing agent logs to retain in the installed agent # move the logs to backup_config folder, then delete at source.
          ansible.builtin.copy:
            src: "{{ java_agent_dest_folder }}/ver{{ backup_version }}/logs"
            dest: "{{ java_agent_backup_config_folder }}/ver/"
            mode: 0755
            remote_src: true
          changed_when: false
          when: old_logs_folder.stat.exists

        - ansible.builtin.file: # delete logs before taking backup
            state: absent
            path: "{{ java_agent_dest_folder }}/ver{{ backup_version }}/logs"
          changed_when: false

        - ansible.builtin.file: #ensure logs folder exists
            state: directory
            path: "{{ java_agent_dest_folder }}/ver{{ backup_version }}/logs"
            mode: 0755
          changed_when: false

        - name: Backup old java agent to {{ java_agent_backup_folder_linux }}
          community.general.archive:
            path: "{{ java_agent_dest_folder }}/"
            dest: "{{ java_agent_backup_file_path }}"
            mode: 0755
          changed_when: false #backup old agent only when this is not a rollback, backup doesn't contain logs
          when: (agent_action|lower != rollback_string)


    - name: Set backup config folder, when undefined but exists in backup directory
      when: not java_agent_already_exists
      block:
        - ansible.builtin.find:
            path: "{{ java_agent_backup_folder_linux }}/"
            patterns: 'conf*'
            file_type: directory
          register: backup_conf_folder

        - ansible.builtin.set_fact:
            java_agent_backup_config_folder: "{{ backup_conf_folder.files[0].path }}"
          when: backup_conf_folder.files | count != 0

        - ansible.builtin.set_fact:
            java_agent_backup_config_folder: ""
          when: backup_conf_folder.files | count == 0 #cleanup if fact was already set in previous run

    - ansible.builtin.set_fact:
        backup_done_if_needed: true

    - name: Clean up old agent files
      ansible.builtin.file:
        path: "{{ java_agent_dest_folder }}"
        state: absent
      changed_when: false

    - name: Ensures application agent dir exists
      ansible.builtin.file:
        path: "{{ java_agent_dest_folder }}/"
        state: directory
        mode: 0755
        recurse: yes
      changed_when: false # this ensures this task is idempotent

    - name: This is an upgrade
      ansible.builtin.include_tasks: java-agent-linux-upgrade.yml
      when: (agent_action|lower != rollback_string)

    #ROLLBACK, get the agent from backup
    - name: If this is a Rollback, Fetch java agent from backup
      ansible.builtin.include_role:
        name: common
        tasks_from: agent_from_backup_linux #run common/tasks/agent_from_backup_linux.yaml
      vars:
        agent_backup_folder_linux: "{{ java_agent_backup_folder_linux }}"
        agent_dest_folder_linux: "{{ java_agent_dest_folder }}"
      when: (agent_action|lower == rollback_string)

  rescue:
    - name: appdynamics_agent_status Output Failed Status
      ansible.builtin.set_fact:
        java_playbook_failed: true

    - name: Error occurred while updating controller-info.xml, Deleting temporary folder from control node
      when: java_merge_finished is defined and java_merge_finished is false
      block:
        - name: Delete controller files
          ansible.builtin.file:
            state: absent
            path: java-temp/controller-info-{{ inventory_hostname }}
          delegate_to: localhost
          vars:
            ansible_become: false

        # Check if any controller-info files are present
        - name: Check if localhost has controller-info.xml files
          ansible.builtin.find:
            paths: java-temp
          delegate_to: localhost
          register: filesFound
          vars:
            ansible_become: false

        # If folder is empty, delete the folder
        - name: Check if folder is empty
          ansible.builtin.file:
            state: absent
            path: java-temp
          delegate_to: localhost
          vars:
            ansible_become: false
          when: filesFound.matched == 0

        - name: Print failure message occured during upgrading controller-info.xml
          ansible.builtin.debug:
            msg: "Error occured while merging controller-info.xml with the args.yaml"

    - name: Error occured while creating backup, Abort after cleanup(if any)
      when: backup_done_if_needed is not defined or backup_done_if_needed is false
      block:
        - name: Cleanup if backup file was created as error occured
          ansible.builtin.file:
            path: "{{ java_agent_backup_file_path }}"
            state: absent
          changed_when: false
          when: java_agent_already_exists is defined and java_agent_already_exists and java_agent_backup_file_path is defined
        - name: Cleanup if config backup file was created
          ansible.builtin.file:
            path: "{{ java_agent_backup_config_folder }}"
            state: absent
          changed_when: false
          when: java_agent_already_exists is defined and java_agent_already_exists and java_agent_backup_config_folder is defined
        - name: Print failure message since error occured before taking agent backup
          ansible.builtin.debug:
            msg: "Error occured while/before creating the backup, on task - {{ ansible_failed_task.name }}. Agent will not be installed."

    #Error occured during installation, put back the agent present before installation
    - name: Error occured during installation/rollback
      when: backup_done_if_needed is true
      block:
        - name: Print failure message since error occured during installation
          ansible.builtin.debug:
            msg: "Error occured during installation/rollback on task - {{ ansible_failed_task.name }}. Trying to restore agent from backup when 'agent_action' is not rollback."
        - name: Clean up agent files present (if any) due to failure during installation
          ansible.builtin.file:
            path: "{{ java_agent_dest_folder }}"
            state: absent
          changed_when: false
        - name: Ensure application agent dir exists
          ansible.builtin.file:
            path: "{{ java_agent_dest_folder }}/"
            state: directory
            mode: 0755
            recurse: yes
          changed_when: false # this ensures this task is idempotent
        - name: Restore java agent from backup when agent_action is not rollback
          ansible.builtin.include_role:
            name: common
            tasks_from: agent_from_backup_linux #run common/tasks/agent_from_backup_linux.yaml
          vars:
            agent_backup_folder_linux: "{{ java_agent_backup_folder_linux }}"
            agent_dest_folder_linux: "{{ java_agent_dest_folder }}"
          when: (agent_action|lower != rollback_string)

  always:
    #update ownership/permissions - only when agent exists in dest
    - name: Find the version specific directory name
      ansible.builtin.find:
        paths: "{{ java_agent_dest_folder }}"
        patterns: "ver*"
        file_type: directory
      register: result

    - ansible.builtin.set_fact:
        agent_exists: "{{ result.files | count > 0 }}"

    - when: agent_exists and backup_done_if_needed
      block:
        - ansible.builtin.set_fact:
            java_agent_ver_folder: "{{ result.files[0].path }}" # "{{ ver.stdout | regex_replace ('\\r\\n', '') }}"

        - when: java_agent_backup_config_folder is defined and java_agent_backup_config_folder | length > 0
          block:
            - ansible.builtin.stat:
                path: "{{ java_agent_backup_config_folder }}/ver/logs"
              register: old_logs_folder

            - name: Retreive agent logs of the previous agent
              ansible.builtin.copy:
                src: '{{ java_agent_backup_config_folder }}/ver/logs'
                dest: '{{ java_agent_ver_folder }}/'
                mode: 0755
                remote_src: true
              changed_when: false
              when: old_logs_folder.stat.exists

        - name: Recursively change ownership of the Java agent directory
          ansible.builtin.file:
            path: "{{ java_agent_dest_folder }}"
            recurse: yes
            owner: "{{ agent_dir_permission.user }}"
            group: "{{ agent_dir_permission.group }}"
          changed_when: false

        - name: Make java agent log and conf dirs writable to appdynamics user and appdynamics group
          ansible.builtin.file:
            path: "{{ item }}"
            recurse: yes
            state: directory
            owner: "{{ agent_dir_permission.user }}"
            group: "{{ agent_dir_permission.group }}"
            mode: '0775'
          loop:
            - "{{ java_agent_ver_folder }}/logs"
            - "{{ java_agent_ver_folder }}/conf"
            - "{{ java_agent_dest_folder }}/conf"
          changed_when: false

        - name: Clean up - remove {{ java_agent_dest_file }}
          ansible.builtin.file:
            path: "{{ java_agent_dest_folder }}/{{ java_agent_dest_file }}"
            state: absent
          changed_when: false # this ensures this task is idempotent


    #cleanup agent configs/logs from backup, only if agent is installed, because it should have already been restored by now,  OR Max_backup_count is 0
    - name: Cleanup - find the agent config in backup dir
      ansible.builtin.find:
        path: "{{ java_agent_backup_folder_linux }}"
        patterns: 'config*'
        file_type: directory
      register: retained_configs

    - name: Delete retained config file in backup dir
      ansible.builtin.file:
        state: absent
        path: "{{ item.path }}"
      changed_when: false
      with_items: "{{ retained_configs.files }}"
      when: retained_configs.files | count > 0 and (agent_exists or max_agent_backup_count == 0)
      loop_control:
        label: "{{ item.path }}"

    #cleanup agent zips from backup if needed
    - name: Cleanup - find the agents in backup dir
      ansible.builtin.find:
        path: "{{ java_agent_backup_folder_linux }}"
        patterns: 'agent*'
      register: backup_files

    - ansible.builtin.debug:
        msg: "Backed-up java agent files present currently : {{ backup_files.files }}"
        verbosity: 1

    - name: Cleanup agent backup files
      when: (backup_files.files | count > max_agent_backup_count)
      block:
        - ansible.builtin.set_fact:
            old_backup_files: "{{ (backup_files.files | sort(attribute='path'))[:-max_agent_backup_count] }}"
          when: max_agent_backup_count > 0

        - ansible.builtin.set_fact:
            old_backup_files: "{{ backup_files.files | sort(attribute='path') }}"
          when: max_agent_backup_count == 0

        - name: Delete the old backup files if more than {{ max_agent_backup_count }}
          ansible.builtin.file:
            state: absent
            path: "{{ item.path }}"
          changed_when: false
          with_items: "{{ old_backup_files }}"
          loop_control:
            label: "{{ item.path }}"

    - name: agent start up result set fact
      ansible.builtin.set_fact:
        agent_result:
          app: "{{ application_name | default(appd.ansible_facts.appdynamics.app) }}"
          tier: "{{ tier_name | default(appd.ansible_facts.appdynamics.tier) }}"
          node: "{{ node_name | default(appd.ansible_facts.appdynamics.node) }}"
          error: false
          install_path: "{{ java_agent_dest_folder | default('') }}"
          agent_type: "{{ agent_type | default('java') }}"
          agent_version: "{{ agent_version | default('') }}"
          action: "{{ agent_action | default('') }}"

    - name: appdynamics.agent.result
      ansible.builtin.debug:
        msg: "{{ agent_result | to_json }}"


    - name: appdynamics_agent_status Output Success Status
      ansible.builtin.debug:
        msg: "Playbook run was successful"
      when: not java_playbook_failed