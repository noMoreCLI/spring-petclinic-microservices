- name: Agent control block
  become: true
  block:
    - name: Autogenerate appdynamics facts
      appdynamics.agents.appd_facts:
        strategy: default   # supported auto naming strategies are: tomcat, jboss, default
      register: appd

    - when: ansible_os_family == 'AIX'
      block:
        - name: Get AIX version
          ansible.builtin.command: "oslevel"
          register: version
          changed_when: false

        - name: Setting AIX Version
          ansible.builtin.set_fact:
            aix_version: "{{ version.stdout.split('.')[:2] | join('.') }}"

    - ansible.builtin.include_tasks: install-agent.yml
      when: ansible_os_family in ['RedHat', 'AIX']
  always:
    # result task
    - name: agent start up result set fact
      ansible.builtin.set_fact:
        agent_result:
          app: "{{ application_name | default(appd.ansible_facts.appdynamics.app) }}"
          tier: "{{ tier_name | default(appd.ansible_facts.appdynamics.tier) }}"
          node: "{{ node_name | default(appd.ansible_facts.appdynamics.node) }}"
          error: "{{ error_status }}"
          install_path: "{{ agent_path | default('') }}"
          agent_type: "{{ agent_type | default('iib') }}"
          agent_version: "{{ agent_version | default('') }}"
          action: "{{ agent_action | default('') }}"

    - name: appdynamics.agent.result
      ansible.builtin.debug:
        msg: "{{ agent_result | to_json }}"
