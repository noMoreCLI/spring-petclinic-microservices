- when: >
    ( ansible_os_family == 'Debian' or ansible_os_family == 'Alpine' or ansible_os_family == 'RedHat')
  block:
    - name: Autogenerate appdynamics facts
      appdynamics.agents.appd_facts:
        strategy: default   # supported auto naming strategies are: tomcat, jboss, default
      register: appd
  
    # This is required by fetch agent role as previous defined ansible vars are not defined in that role
    - name: Setting environment for installation path
      ansible.builtin.set_fact:
        python_agent_dest_folder: "{{ agent_path }}"
        python_agent_dest_file: "{{ python_agent_dest_file }}"

    - name: Extract Config File name from path
      ansible.builtin.set_fact:
        config_file_name: "{{ agent_config_path.split('/')[-1] }}"
        config_file_path_prefix: "{{ agent_config_path.split('/')[:-1] | join('/') }}"

    - name: Set Package Name if OS Family is Redhat or Debian
      ansible.builtin.set_fact:
        python_package_name: 'appdynamics'
      when: ansible_os_family in ['Debian', 'RedHat']

    - name: Set Package Name if OS Family is Alpine
      ansible.builtin.set_fact:
        python_package_name: 'appdynamics-alpine'
      when: ansible_os_family == 'Alpine'

    - name: Global Python Install
      ansible.builtin.set_fact:
        python_path: pip3
      when: install_env == "default"

    - name: Set Python Path According to Virtualenv
      ansible.builtin.set_fact:
        python_path: "{{ virtualenv_path }}/bin/pip"
      when: install_env == "virtualenv"

    - name: Install Agent and update config
      ansible.builtin.include_tasks: install-agent.yml
      when: ((agent_action|lower == install_string) or (agent_action|lower == upgrade_string))

    - name: Rollback Agent
      ansible.builtin.include_tasks: rollback.yml
      when: (agent_action|lower == rollback_string)

    - name: Uninstall Agent
      ansible.builtin.include_tasks: uninstall-agent.yml
      when: (agent_action|lower == uninstall_string)

  always:
    # result task
    - name: Get python path for virtual env installation
      ansible.builtin.set_fact:
        python_install_path: "{{ virtualenv_path }}/bin/python"
      when: virtualenv_path is defined and install_env == 'virtualenv' and virtualenv_path | length > 0
  
    - name: Get python path for default installation
      ansible.builtin.set_fact:
        python_install_path: "{{ ansible_python.executable }}"
      when: install_env == 'default'

    - name: agent start up result set fact
      ansible.builtin.set_fact:
        agent_result:
          app: "{{ application_name | default(appd.ansible_facts.appdynamics.app) }}"
          tier: "{{ tier_name | default(appd.ansible_facts.appdynamics.tier) }}"
          node: "{{ node_name | default(appd.ansible_facts.appdynamics.node) }}"
          error: "{{ error_status }}"
          install_path: "{{ python_install_path | default('') }}"
          agent_type: "{{ agent_type | default('python') }}"
          agent_version: "{{ agent_version | default('') }}"
          action: "{{ agent_action | default('') }}"

    - name: appdynamics.agent.result
      ansible.builtin.debug:
        msg: "{{ agent_result | to_json }}"
