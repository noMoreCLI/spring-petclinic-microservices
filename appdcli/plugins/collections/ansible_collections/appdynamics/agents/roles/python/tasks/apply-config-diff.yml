- name: Apply config diff
  become: "{{ run_with_root }}"
  block:
    - name: Setting values for config to be used in template
      ansible.builtin.set_fact:
        app: "{{ application_name | default(appd.ansible_facts.appdynamics.app) }}"
        tier: "{{ tier_name | default(appd.ansible_facts.appdynamics.tier) }}"
        node: "{{ node_name | default(appd.ansible_facts.appdynamics.node) }}"
        config_dir: "{{ agent_dir }}"
        config_node_reuse: "{{ node_reuse }}"
        config_node_reuse_prefix: "{{ node_reuse_prefix }}"
        config_unique_host_id: "{{ unique_host_id }}"
        config_wsgi_callable: "{{ wsgi_callable }}"
        config_wsgi_script: "{{ wsgi_script }}"
        config_wsgi_module: "{{ wsgi_module }}"
        config_controller_host_name: "{{ controller_host_name }}"
        config_controller_port: "{{ controller_port }}"
        config_controller_account_name: "{{ controller_account_name }}"
        config_controller_account_access_key: "{{ controller_account_access_key }}"
        config_enable_controller_ssl: "{{ enable_ssl }}"
        config_controller_certfile: "{{ controller_certfile }}"
        # log
        config_log_level: "{{ log_level }}"
        config_log_debugging: "{{ log_debugging }}"
        config_log_dir: "{{ log_dir }}"
        # eum
        config_eum_disable_cookie: "{{ eum_disable_cookie }}"
        config_eum_user_agent_allowlist: "{{ eum_user_agent_allowlist }}"
        # snapshot
        config_snapshot_exit_call_details_length: "{{ snapshot_exit_call_details_length }}"
        # transaction-monitor
        config_transaction_monitor_bt_max_duration_ms: "{{ transaction_monitor_bt_max_duration_ms }}"
        # analytics agent config
        config_analytics_host: "{{ analytics_host }}"
        config_analytics_port: "{{ analytics_port }}"
        config_analytics_ssl: "{{ analytics_ssl }}"
        config_analytics_ca_file: "{{ analytics_ca_file }}"

    - name: Merge Config in case of upgrade
      when: (agent_action|lower == upgrade_string)
      block:

        - name: Check if config File exists
          ansible.builtin.stat:
            path: "{{ agent_config_path }}"
          register: agent_config_file

        - name: Error in case Config file is not found
          ansible.builtin.fail:
            msg: "Please check the path provided for config file as file does not exists on the given path. Rolling back to Previous state"
          when: not agent_config_file

        - name: Cat the existing CFG file
          ansible.builtin.shell: "cat {{ agent_config_path }}"
          changed_when: false
          register: cfg_file

        - name: Set default values for initial check # check is done before setting it to default in next task
          ansible.builtin.set_fact:
            setter: "None"
            cfg_dict: "{{ {} }}"

        - name: Setting target config specs to dict
          ansible.builtin.set_fact:
            setter: "{{ item.split('[')[-1].split(']')[0].split(':')[-1] | default('') if item.strip()[0] == '[' else setter }}"
            cfg_dict: "{{ cfg_dict | default({}) | combine({ setter + '-' + item.split('=')[0].strip(): item.split('=')[1].strip()}) if item.strip()[0] != '[' else cfg_dict }}"
          with_items: "{{ cfg_file.stdout_lines }}"
          when: item.strip() != ""
        
        - name: Debugging cfg_dict Logs
          debug:
            msg: "{{ cfg_dict }}"

        - name: Merge Config changes if any
          ansible.builtin.set_fact:
            app: "{{ cfg_dict.get('agent-app', '') if app == appd.ansible_facts.appdynamics.app else app }}"
            tier: "{{ cfg_dict.get('agent-tier', '') if tier == appd.ansible_facts.appdynamics.tier else tier }}"
            node: "{{ cfg_dict.get('agent-node', '') if node == appd.ansible_facts.appdynamics.node else node  }}"
            config_dir: "{{ cfg_dict.get('agent-dir', '') if config_dir == '/tmp/appd/' else config_dir }}"
            config_node_reuse: "{{ cfg_dict.get('agent-nodereuse', '') if config_node_reuse == '' else config_node_reuse }}"
            config_node_reuse_prefix: "{{ cfg_dict.get('agent-nodereuseprefix', '') if config_node_reuse_prefix == '' else config_node_reuse_prefix }}"
            config_unique_host_id: "{{ cfg_dict.get('agent-uniquehostid', '') if config_unique_host_id == '' else config_unique_host_id }}"
            config_wsgi_callable: "{{ cfg_dict.get('wsgi-callable', '') if config_wsgi_callable == 'application' else config_wsgi_callable }}"
            config_wsgi_script: "{{ cfg_dict.get('wsgi-script', '') if config_wsgi_script == '' else config_wsgi_script }}"
            config_wsgi_module: "{{ cfg_dict.get('wsgi-module', '') if config_wsgi_module == '' else config_wsgi_module }}"
            config_controller_host_name: "{{ cfg_dict.get('controller-host', '') if config_controller_host_name is not defined else config_controller_host_name }}"
            config_controller_port: "{{ cfg_dict.get('controller-port', '') if config_controller_port is not defined else config_controller_port }}"
            config_controller_account_name: "{{ cfg_dict.get('controller-account', '') if config_controller_account_name is not defined else config_controller_account_name }}"
            config_controller_account_access_key: "{{ cfg_dict.get('controller-accesskey', '') if config_controller_account_access_key is not defined else config_controller_account_access_key }}"
            config_enable_controller_ssl: "{{ enable_ssl if enable_ssl is defined and enable_ssl else cfg_dict.get('controller-ssl', '') }}"
            config_controller_certfile: "{{ cfg_dict.get('controller-certfile', '') if config_controller_certfile == '' else config_controller_certfile }}"
            config_log_level: "{{ cfg_dict.get('log-level', '') if config_log_level == 'warning' else config_log_level }}"
            config_log_debugging: "{{ cfg_dict.get('log-debugging', '') if not config_log_debugging else config_log_debugging }}"
            config_log_dir: "{{ cfg_dict.get('log-dir', '') if config_log_dir ==  '/tmp/appd/logs' else config_log_dir }}"
            config_eum_disable_cookie: "{{ cfg_dict.get('eum-disable-cookie', '') if config_eum_disable_cookie ==  'off' else config_eum_disable_cookie }}"
            config_eum_user_agent_allowlist: "{{ cfg_dict.get('eum-user-agent-allowlist', '') if config_eum_user_agent_allowlist ==  'Mozilla, Opera, WebKit, Nokia' else config_eum_user_agent_allowlist }}"
            config_snapshot_exit_call_details_length: "{{ cfg_dict.get('snapshot-exit-call-details-length', '') if config_snapshot_exit_call_details_length ==  '100' else config_snapshot_exit_call_details_length }}"
            config_transaction_monitor_bt_max_duration_ms: "{{ cfg_dict.get('transaction-monitor-bt-max-duration-ms', '') if config_transaction_monitor_bt_max_duration_ms ==  '120000' else config_transaction_monitor_bt_max_duration_ms }}"
            config_analytics_host: "{{ cfg_dict.get('analytics-host', '') if config_analytics_host ==  'localhost' else config_analytics_host }}"
            config_analytics_port: "{{ cfg_dict.get('analytics-port', '') if config_analytics_port ==  '9090' else config_analytics_port }}"
            config_analytics_ssl: "{{ cfg_dict.get('analytics-ssl', '') if not config_analytics_ssl else config_analytics_ssl }}"
            config_analytics_ca_file: "{{ cfg_dict.get('analytics-ca-file', '') if config_analytics_ca_file ==  '' else config_analytics_ca_file }}"
            # http-proxy config
            proxy_host: "{{ cfg_dict.get('http-proxy-host', '') if proxy_host is not defined or proxy_host ==  '' else proxy_host }}"
            proxy_port: "{{ cfg_dict.get('http-proxy-port', '') if proxy_port is not defined or proxy_port ==  '' else proxy_port }}"
            proxy_user: "{{ cfg_dict.get('http-proxy-user', '') if proxy_user is not defined or proxy_user ==  '' else proxy_user }}"
            proxy_password_file: "{{ cfg_dict.get('http-proxy-password-file', '') if proxy_password_file is not defined or proxy_password_file ==  '' else proxy_password_file }}"
            # proxy internal config
            max_heap_size: "{{ cfg_dict.get('proxy-max-heap-size', '') if max_heap_size is not defined or max_heap_size ==  '' else max_heap_size }}"
            min_heap_size: "{{ cfg_dict.get('proxy-min-heap-size', '') if min_heap_size is not defined or min_heap_size ==  '' else min_heap_size }}"
            max_perm_size: "{{ cfg_dict.get('proxy-max-perm-size', '') if max_perm_size is not defined or max_perm_size ==  '' else max_perm_size }}"
            proxy_debug_port: "{{ cfg_dict.get('proxy-proxy-debug-port', '') if proxy_debug_port is not defined or proxy_debug_port ==  '' else proxy_debug_port }}"
            start_suspended: "{{ cfg_dict.get('proxy-start-suspended', '') if start_suspended is not defined or start_suspended ==  '' else start_suspended }}"
            debug_opt: "{{ cfg_dict.get('proxy-debug-opt', '') if debug_opt is not defined or debug_opt ==  '' else debug_opt }}"
            proxy_agent: "{{ cfg_dict.get('proxy-agent', '') if proxy_agent is not defined or proxy_agent ==  '' else proxy_agent }}"
            tcp_comm_host: "{{ cfg_dict.get('proxy-tcp-comm-host', '') if tcp_comm_host is not defined or tcp_comm_host ==  '' else tcp_comm_host }}"
            tcp_comm_port:  "{{ cfg_dict.get('proxy-tcp-comm-port', '') if tcp_comm_port is not defined or tcp_comm_port ==  '' else tcp_comm_port }}"
            tcp_reporting_port: "{{ cfg_dict.get('proxy-tcp-reporting-port', '') if tcp_reporting_port is not defined or tcp_reporting_port ==  '' else tcp_reporting_port }}"
            tcp_request_port: "{{ cfg_dict.get('proxy-tcp-request-port', '') if tcp_request_port is not defined or tcp_request_port ==  '' else tcp_request_port }}"
            tcp_port_range: "{{ cfg_dict.get('proxy-tcp-port-range', '') if tcp_port_range is not defined or tcp_port_range ==  '' else tcp_port_range }}"
    - name: Apply config successful
      ansible.builtin.set_fact:
        config_is_set: true

  rescue:
    - name: Printing to output file as error occurred while applying config
      ansible.builtin.debug:
        msg: 'Error occurred while applying config, old configuration on machine will be retained. Task Failed - {{ ansible_failed_task.name }}'