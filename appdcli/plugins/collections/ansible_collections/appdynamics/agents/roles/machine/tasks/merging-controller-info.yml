---
- block:
  - ansible.builtin.set_fact:
      machine_merge_finished: false

  # Creating a dict with variables names and corresponding controller tags
  - name: Load controller-info variable map
    ansible.builtin.set_fact:
      controller_info_variable_map: "{{ lookup('file', '{{ role_path }}/files/controller_info_variable_map.json') | from_json }}"

  # Creating a dict of all the variables mentioned in args.yaml
  - name: Adding defined variable in list
    vars:
      defined_controller_variables: {}
    ansible.builtin.set_fact:
      defined_controller_variables: "{{ defined_controller_variables | combine({item.key: lookup('ansible.builtin.vars', item.key)}) }}"
    loop: "{{ lookup('dict', controller_info_variable_map) }}"
    when: lookup('ansible.builtin.varnames', item.key)

  - name: Capturing dest folder to put /conf/controller-info.xml file
    ansible.builtin.set_fact:
      machine_agent_dest_folder_controller_info: "{{ machine_agent_dest_folder_linux }}"

  - name: Capturing dest folder to put /conf/controller-info.xml file for windows
    ansible.builtin.set_fact:
      machine_agent_dest_folder_controller_info: "{{ machine_agent_dest_folder_win }}"
    when: (ansible_os_family == 'Windows')

  # Fetching controller-info from managed node to control node
  - name: Storing in a path relative to the playbook
    ansible.builtin.fetch:
      src: "{{ machine_agent_dest_folder_controller_info }}/conf/controller-info.xml"
      dest: machine-temp/controller-info-{{ inventory_hostname }}
      flat: yes

  - name: Read application name from controller-info
    community.general.xml:
      path: machine-temp/controller-info-{{ inventory_hostname }}
      xpath: '/controller-info/application-name'
      content: text
    register: machine_controller_info_application_name
    ignore_errors: true
    vars:
      ansible_become: false
    delegate_to: localhost

  - name: Read tier name from controller-info
    community.general.xml:
      path: machine-temp/controller-info-{{ inventory_hostname }}
      xpath: '/controller-info/tier-name'
      content: text
    register: machine_controller_info_tier_name
    ignore_errors: true
    vars:
      ansible_become: false
    delegate_to: localhost

  - name: Read node name from controller-info
    community.general.xml:
      path: machine-temp/controller-info-{{ inventory_hostname }}
      xpath: '/controller-info/node-name'
      content: text
    register: machine_controller_info_node_name
    ignore_errors: true
    vars:
      ansible_become: false
    delegate_to: localhost

  - name: Read SSL enabled value from controller-info
    community.general.xml:
      path: machine-temp/controller-info-{{ inventory_hostname }}
      xpath: '/controller-info/controller-ssl-enabled'
      content: text
    register: controller_info_ssl_enabled
    vars:
      ansible_become: false
    delegate_to: localhost

  - name: If Old values not defined use them as empty string
    set_fact:
      machine_controller_info_application_name : ""
    when: machine_controller_info_application_name.msg is defined and machine_controller_info_application_name.msg is search(" does not reference a node")

  - name: If Old values not defined use them as empty string
    set_fact:
      machine_controller_info_tier_name : ""
    when: machine_controller_info_tier_name.msg is defined and machine_controller_info_tier_name.msg is search(" does not reference a node")

  - name: If Old values not defined use them as empty string
    set_fact:
      machine_controller_info_node_name: ""
    when: machine_controller_info_node_name.msg is defined and machine_controller_info_node_name.msg is search(" does not reference a node")

  - name: If Old app name is in form of dict, fetch the extact value
    set_fact:
      machine_controller_info_application_name: "{{machine_controller_info_application_name.matches[0].values()}}"
    when: machine_controller_info_application_name | type_debug == 'dict'

  - name: If Old tier name is in form of dict, fetch the extact value
    set_fact:
      machine_controller_info_tier_name: "{{machine_controller_info_tier_name.matches[0].values()}}"
    when: machine_controller_info_tier_name | type_debug == 'dict'

  - name: If Old node name is in form of dict, fetch the extact value
    set_fact:
      machine_controller_info_node_name: "{{machine_controller_info_node_name.matches[0].values()}}"
    when: machine_controller_info_node_name | type_debug == 'dict'

  - name : If old node name is list, extract first element
    set_fact:
      machine_controller_info_node_name: "{{machine_controller_info_node_name[0]}}"
    when: machine_controller_info_node_name | type_debug == 'list'

  - name: If old tier name is list, extract first element
    set_fact:
      machine_controller_info_tier_name: "{{machine_controller_info_tier_name[0]}}"
    when: machine_controller_info_tier_name | type_debug == 'list'

  - name: If old app name is list, extract first element
    set_fact:
      machine_controller_info_application_name: "{{machine_controller_info_application_name[0]}}"
    when: machine_controller_info_application_name | type_debug == 'list'

  # Updating new values to the controller-info
  - name: Change key on controller xml file
    community.general.xml:
      path: machine-temp/controller-info-{{ inventory_hostname }}
      xpath: '/controller-info/{{ controller_info_variable_map[item.key] }}'
      value: '{{ item.value | string }}'
    delegate_to: localhost
    vars:
      ansible_become: false
    loop: "{{ lookup('dict', defined_controller_variables) }}"

  - name: Setting App name to default if undefined
    ansible.builtin.set_fact:
      temp_application_name: ""
    when: application_name is not defined

  - name: Setting Node name to default if undefined
    ansible.builtin.set_fact:
      temp_node_name: ""
    when: node_name is not defined

  - name: Setting Tier name to default if undefined
    ansible.builtin.set_fact:
      temp_tier_name: ""
    when: tier_name is not defined

  - name: Setting App name to value if defined
    ansible.builtin.set_fact:
      temp_application_name: "{{ application_name }}"
    when: application_name is defined

  - name: Setting Node name to value if defined
    ansible.builtin.set_fact:
      temp_node_name: "{{ node_name }}"
    when: node_name is defined

  - name: Setting Tier name to value if defined
    ansible.builtin.set_fact:
      temp_tier_name: "{{ tier_name }}"
    when: tier_name is defined

#     Retaining config when machine agent installed with valid app, tier, node values and trying to
#     upgrade with empty values, else we should always upgrade them to new values
  - name: If App, tier, node were already defined, retain them
    when: (item.new_config == item.default and item.old_config != None) and item.old_config != ""
    community.general.xml:
      path: machine-temp/controller-info-{{ inventory_hostname }}
      xpath: '/controller-info/{{ item.key }}'
      value: '{{ item.old_config }}'
    with_items:
      - { key: "application-name", old_config: "{{ machine_controller_info_application_name }}",
          new_config: "{{ temp_application_name }}", default: "" }
      - { key: "node-name", old_config: "{{ machine_controller_info_node_name }}",
          new_config: "{{ temp_node_name }}", default: "" }
      - { key: "tier-name", old_config: "{{ machine_controller_info_tier_name }}",
          new_config: "{{ temp_tier_name }}", default: "" }
    delegate_to: localhost
    vars:
      ansible_become: false

  - name: If enable_ssl were already defined, retain them
    when: (item.new_config == "" or (item.new_config == item.default and item.old_config[0] != None))
    community.general.xml:
      path: machine-temp/controller-info-{{ inventory_hostname }}
      xpath: '/controller-info/{{ item.key }}'
      value: '{{ item.old_config[0] }}'
    with_items:
      - { key: "controller-ssl-enabled", old_config: "{{ controller_info_ssl_enabled.matches[0].values() }}",
          new_config: "{{ enable_ssl | bool }}", default: False }
    delegate_to: localhost
    vars:
      ansible_become: false

  # Sending controller-info back to managed node
  - name: Transfering controller-info back to managed nodes
    ansible.builtin.copy:
      src: machine-temp/controller-info-{{ inventory_hostname }}
      dest: "{{ machine_agent_dest_folder_controller_info }}/conf/controller-info.xml"

  # Deleting corresponding controller-info file
  - name: Delete controller files
    ansible.builtin.file:
      state: absent
      path: machine-temp/controller-info-{{ inventory_hostname }}
    delegate_to: localhost
    vars:
      ansible_become: false

  # Check if any controller-info files are present
  - name: Check if localhost has controller-info.xml files
    ansible.builtin.find:
      paths: machine-temp
    delegate_to: localhost
    register: filesFound
    vars:
      ansible_become: false

  # If folder is empty, delete the folder
  - name: Check if folder is empty
    ansible.builtin.file:
      state: absent
      path: machine-temp
    delegate_to: localhost
    vars:
      ansible_become: false
    when: filesFound.matched == 0

  - ansible.builtin.set_fact:
      machine_merge_finished: true