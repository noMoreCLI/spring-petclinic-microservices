---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: true
  vars:
    # Expected agent variables
    expected_agent_version: "23.2.0.684"
    expected_application_name: app_new
    expected_tier_name: tier_new
    expected_node_name: node_new
    expected_controller_host_name: "random-controller"
    expected_controller_port: "8090"
    expected_controller_account_name: "random-customer"
    expected_controller_account_access_key: "random-access-key"


  tasks:
  - name: Check if Agent installed with the specific version as playbook
    block:

      - name: Find if appdynamics agent is installed in system
        shell: "php -m | grep appdynamics_agent"
        register: agent_status
      
      - name: Run php command and filter output
        shell: "php -r 'foreach (get_loaded_extensions() as $extension) echo \"$extension: \" . phpversion($extension) . \"\\n\";' | grep appdynamics_agent"
        register: php_output
        changed_when: false
        check_mode: no

      - name: Register version number
        shell: "echo {{ php_output.stdout }} | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+'"
        register: agent_version
      
      - name: Assert that correct version is installed
        assert:
          that: 
            - agent_version.stdout_lines[0] == expected_agent_version
          success_msg: "Latest Agent installed as per default setup"
          fail_msg: "Latest Agent not installed as per default setup. Check Failed"

  - name: Check if agent config is correct as expected
    block:
      - name: Finding the absolute path for appdynamics_agent.ini
        shell: "php -i | grep 'Loaded Configuration File' | awk '{print $NF}' | xargs dirname | xargs -I{} find {} -name appdynamics_agent.ini"
        register: config_path

      - name: Cat the INI file
        shell: "cat {{config_path.stdout}}"
        register: config_file

      - name: Setting config specs to dict
        set_fact: 
          config_dict: "{{ config_dict | default({}) | combine ({ item.split(' = ')[0] : item.split(' = ')[1] }) }}"
        with_items: "{{ config_file.stdout_lines[1:] }}" # skipping the first index since it would be the section of ini file

      - name: Logging version
        debug:
          msg: "{{config_dict}}"

      - name: Assert that correct config is installed with agent
        assert:
          that:
            - config_dict['agent.applicationName'] == expected_application_name
            - config_dict['agent.tierName'] == expected_tier_name
            - config_dict['agent.nodeName'] == expected_node_name
            - config_dict['agent.controller.hostName'] == expected_controller_host_name
            - config_dict['agent.controller.port'] == expected_controller_port
          success_msg: "Config successfully installed"
          fail_msg: "Config not installed! Check Failed"

        