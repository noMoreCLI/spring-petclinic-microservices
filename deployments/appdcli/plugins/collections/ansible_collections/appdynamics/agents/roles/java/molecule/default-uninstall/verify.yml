---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify that agent uninstall was a success.
      block:
        - name: Check if Agent File is present after uninstall
          stat:
            path: "/opt/appdynamics/java-agent"
          register: agent_found

        - name: Check if Agent backup folder is present after uninstall
          stat:
            path: "/opt/appdynamics/backup/java-agent"
          register: agent_backup_found

        - name: Assert that Agent is successfully uninstalled and backup deleted.
          assert:
            that:
              - not (agent_found.stat.exists or agent_backup_found.stat.exists)
            success_msg: "Agent and backup is successfully deleted"
            fail_msg: "Uninstall was not a success. Check Failed"

        - shell: "echo $APPDYNAMICS_ANSIBLE_INSTALLED_AGENTS"
          register: env_variable_present
          changed_when: false

        - name: Verify env var is Removed
          assert:
            that: env_variable_present.stdout | length == 0