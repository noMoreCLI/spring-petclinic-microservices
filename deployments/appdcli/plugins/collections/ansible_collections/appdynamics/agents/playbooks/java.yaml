---
- name: Install Javaagent
  hosts: localhost
  tasks:
    - name: Include variables for the controller settings
      ansible.builtin.include_vars:
        # Include all yaml files under the vars directory
        dir: vars
        extensions:
          - 'yaml'
          - 'yml'
    - ansible.builtin.include_role:
        name: appdynamics.agents.java
      vars:
        # Define Agent Type and Version
        #agent_version: 22.6.0
        agent_type: sun-java
        agent_action: upgrade
#        linux_custom_agent_install_path: /opt/appdynamics/java_agent
#        windows_custom_agent_install_path: C:\\appdynamics\\java_agent
