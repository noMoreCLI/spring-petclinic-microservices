---
- name: Rename agent.log and node directory to conserve them
  become: true
  block:
    - name: Check if agent.log file exists
      ansible.builtin.stat:
        path: "{{ agent_path }}/logs/agent.log"
      register: agent_log_file

    - name: Rename agent.log file with timestamp
      ansible.builtin.command: "mv {{ agent_path }}/logs/agent.log {{ agent_path }}/logs/agent_{{ ansible_date_time.iso8601 }}.log"
      changed_when: false
      when: agent_log_file.stat.exists
    
    - name: Check if node folder exists
      ansible.builtin.stat:
        path: "{{ agent_path }}/logs/node"
      register: agent_node_folder

    - name: Rename node folder with timestamp
      ansible.builtin.command: "mv {{ agent_path }}/logs/node {{ agent_path }}/logs/node_{{ ansible_date_time.iso8601 }}"
      changed_when: false
      when: agent_node_folder.stat.exists

- name: Agent Destination Cleanup block
  become: true
  block:
    - name: Find Directory in Destination Folder
      ansible.builtin.find:
        paths: "{{ agent_path }}/"
        file_type: directory
        excludes: 'logs'
      register: dir_to_delete

    - name: Remove all Files from Directory
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ dir_to_delete.files }}"
      changed_when: false

    - name: Find Files in Destination Folder
      ansible.builtin.find:
        paths: "{{ agent_path }}/"
        exclude: 
          - "{{ agent_config_file }}"
          - "{{ ini_file_name }}" 
        file_type: file
      register: files_to_delete

    - name: Remove all Files from Agent Destination
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ files_to_delete.files }}"
      changed_when: false