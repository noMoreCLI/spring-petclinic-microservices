- name: Agent Destination Cleanup block
  become: true
  block:
    - name: Check agent directory
      ansible.builtin.stat:
        path: "{{ agent_path }}/appdynamics"
      register: agent_dir

    - name: Cleanup agent directory
      when: agent_dir.stat.exists
      block:
        - name: Find Directory in Destination Folder
          ansible.builtin.find:
            paths: "{{ agent_path }}/appdynamics"
            file_type: directory
            excludes: 'logs'
          register: dir_to_delete

        - name: Remove all Files from Directory
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          with_items: "{{ dir_to_delete.files }}"
          changed_when: false

        - name: Find Files in Destination Folder
          ansible.builtin.find:
            paths: "{{ agent_path }}/appdynamics"
            file_type: file
          register: files_to_delete

        - name: Remove all Files from Agent Destination
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          with_items: "{{ files_to_delete.files }}"
          changed_when: false
