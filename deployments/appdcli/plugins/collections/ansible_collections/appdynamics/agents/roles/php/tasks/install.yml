---
- name: Agent install Block
  become: true
  block:
    - name: Assert if install parameters are defined
      ansible.builtin.assert:
        that:
          - parameters is defined
          - log_directory is defined
          - agent_path is defined
          - agent_log_level_tag is defined

    - name: Make agent directories writable to user and group
      ansible.builtin.file:
        path: "{{ agent_path }}"
        recurse: true
        state: directory
        owner: "{{ agent_dir_permission.user }}"
        group: "{{ agent_dir_permission.group }}"
        mode: '0755'
      changed_when: false
      
    - name: Make User log directories writable to user and group
      ansible.builtin.file:
        path: "{{ log_directory }}"
        state: directory
        owner: "{{ agent_dir_permission.user }}"
        group: "{{ agent_dir_permission.group }}"
        mode: '0777'
        recurse: true
      changed_when: false # this ensures this task is idempotent
      when: log_directory is defined and log_directory|length > 0

    - name: Command for installation to be triggred
      ansible.builtin.debug:
        msg: "Command to triggred for installation of php Agent:-
         .{{ agent_path }}/install.sh {{ parameters }}"

    - name: Install Agent
      ansible.builtin.command:
        chdir: "{{ agent_path }}"
        cmd: "./install.sh {{ parameters }}"
      changed_when: false
      register: installation_output

    - name: Logging the installation tasks result
      ansible.builtin.debug:
        msg: "Logging the installation logs :- {{ installation_output.stdout_lines }}"

    - name: Check if Agent log config file exists
      ansible.builtin.stat:
        path: "{{ agent_path }}/php/conf/appdynamics_agent_log4cxx.xml"
      register: agent_log_config

    - name: Make Agent log conf directory writable to user and group
      ansible.builtin.file:
        path: "{{ agent_path }}/php/conf/appdynamics_agent_log4cxx.xml"
        owner: "{{ agent_dir_permission.user }}"
        group: "{{ agent_dir_permission.group }}"
        mode: '0777'
      changed_when: false # this ensures this task is idempotent
      when: agent_log_config.stat.exists

    - name: Check if previous ini file exists in agent directory
      ansible.builtin.stat:
        path: "{{ agent_path }}/{{ ini_file_name }}"
      register: backup_ini_file_check

    - name: Seralizing previous agent config is agent action is rollback
      when: backup_ini_file_check.stat.exists
      block:
        - name: Reading previous agent ini file from agent directory
          ansible.builtin.shell: "cat {{ agent_path }}/{{ ini_file_name }}"
          changed_when: false
          register: current_agent_ini_file

        - name: Setting previous config parameters to a dict
          ansible.builtin.set_fact: 
            current_agent_ini_dict: "{{ current_agent_ini_dict | default({}) | combine({item.split('=')[0].strip(): item.split('=')[1].strip()}) }}"
          with_items: "{{ current_agent_ini_file.stdout_lines[1:] }}" # skipping the first index since it would be the section of ini file
          when: item.strip()[0] != '#'

    # Merging custom parameters of previous ini to global ini for agent specfic parameters
    - name: Merging extra parameters which are not present during install
      when: current_agent_ini_dict is defined
      block:
        # get the upgraded ini file path
        - name: Get appdynamics_agent.ini file path if custom_agent_ini_file is not defined
          ansible.builtin.shell: "{{ php_path }} -i | grep 'Loaded Configuration File' | awk '{print $NF}' | xargs dirname | xargs -I{} find {} -name {{ ini_file_name }}"
          register: agent_ini_output
          changed_when: false
          ignore_errors: true

        - name: Setting agent_ini_file_path for default agent actions
          ansible.builtin.set_fact:
            agent_ini_file_path: "{{ agent_ini_output.stdout }}"

        - name: Reading upgraded ini file from given agent_ini_file_path
          ansible.builtin.shell: "cat {{ agent_ini_file_path }}"
          changed_when: false
          register: upgraded_ini_file

        - name: Setting latest config specs to dict
          ansible.builtin.set_fact: 
            upgraded_ini_dict: "{{ upgraded_ini_dict | default({}) | combine({item.split('=')[0].strip(): item.split('=')[1].strip()}) }}"
          with_items: "{{ upgraded_ini_file.stdout_lines[1:] }}" # skipping the first index since it would be the section of ini file
          when: item.strip()[0] != '#'

        - name: Getting custom parameters which were applied in previous agent's config
          ansible.builtin.set_fact:
            custom_parameters: "{{ current_agent_ini_dict.keys() | difference(upgraded_ini_dict.keys()) }}"

        - name: Adding custom parameters to upgraded INI file
          ansible.builtin.lineinfile:
            dest: "{{ agent_ini_file_path }}"
            line: "{{ item }} = {{ current_agent_ini_dict[item] }}"
            insertafter: "[AppDynamics Agent]" #inserting after the section name of ini file
          loop: "{{ custom_parameters }}"

    - name: Update log level
      ansible.builtin.replace:
        path: '{{ agent_path }}/php/conf/appdynamics_agent_log4cxx.xml'
        regexp: 'value="info"'
        replace: 'value="{{ agent_log_level_tag }}"'

    # Calling handler for installation checks
    - name: Notifying to handler for install checks
      ansible.builtin.debug:
        msg: "Notifying handler for successfull install checks"
      changed_when: true
      notify: "Verify php agent install"
