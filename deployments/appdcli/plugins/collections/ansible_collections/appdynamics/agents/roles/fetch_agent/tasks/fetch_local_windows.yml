---
- name: Check that the agent file exists on the local path
  ansible.builtin.stat:
    path: '{{ agent_source_location }}'
  delegate_to: 'localhost'
  register: stat_result

- name: Assert Local file exists
  ansible.builtin.assert:
    that: stat_result.stat.exists
    msg: 'The custom download resource does not exist, please check input'

- name: Copying Agent zip file from local to managed Nodes
  ansible.windows.win_copy:
    src: '{{ agent_source_location }}'
    dest: '{{ agent_destination_path }}'