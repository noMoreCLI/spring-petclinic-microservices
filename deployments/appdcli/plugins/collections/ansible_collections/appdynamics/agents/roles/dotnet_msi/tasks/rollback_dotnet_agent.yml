- name: Check .Net Agent MSI backup directory exists
  ansible.windows.win_stat:
    path: "{{ dotnet_agent_backup_folder_win }}"
  register: stat_result

- name: Assert .Net Agent MSI backup directory exists
  ansible.builtin.assert:
    that: stat_result.stat.exists
    msg:
    - "Cannot perform .Net Agent MSI rollback. No history of .Net Agent MSI installation managed by this role"
    - "This can happen if it's the first .Net Agent MSI installation or the agent was not previously installed using this role or the rollback was already performed"

- name: Ensure .Net Agent MSI temp directory exists and empty
  ansible.windows.win_file:
    path: "{{ dotnet_agent_dest_folder_win }}\\"
    state: "{{ item }}"
  loop:
    - absent
    - directory

- name: Uninstall current .Net Agent MSI if needed
  ansible.builtin.include_tasks: uninstall_dotnet_agent.yml

- name: Restore .Net Agent MSI from backup
  ansible.windows.win_copy:
    src: "{{ dotnet_agent_backup_folder_win }}//" #// at the end means content of the folder will be copied to destination, not the source folder itself
    dest: "{{ dotnet_agent_dest_folder_win }}"
    remote_src: "true"
    force: yes

# cleanup backup folder before installing the agent so we won't stuck in an infinite loop in case the rollback fails
- name: Cleanup .Net Agent MSI backup folder
  ansible.windows.win_file:
    path: "{{ dotnet_agent_backup_folder_win }}\\"
    state: absent

- name: Set .Net Agent MSI Version for Result to undefined
  ansible.builtin.set_fact:
    dotnet_msi_agent_version: null

- name: Install .Net Agent MSI
  ansible.builtin.include_tasks: install_dotnet_agent.yml