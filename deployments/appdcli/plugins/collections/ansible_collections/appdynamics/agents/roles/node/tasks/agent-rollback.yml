- name: Agent rollback
  become: true
  block:
    - name: Common agent rollback part
      block:
        - name: Check if appd-version exists in backup
          ansible.builtin.stat:
            path: "{{ node_agent_backup_folder }}/appd-version.txt"
          register: backup_appd_version_exists

        - name: Check if backup config exists
          ansible.builtin.stat:
            path: "{{ node_agent_backup_folder }}/appd-config.js"
          register: backup_config_exists

        - name: Restoring appd-config file in case it exists
          ansible.builtin.shell: "cp {{ node_agent_backup_folder }}/appd-config.js {{ node_agent_dest_folder }}/"
          when: backup_appd_version_exists.stat.exists

        - name: Read the backed up version of appd
          ansible.builtin.slurp:
            src: "{{ node_agent_backup_folder }}/appd-version.txt"
          register: node_backup_version

        - name: Run npm install on restored node agent
          # ansible.builtin.shell: "cd {{ node_agent_dest_folder }} npm install appdynamics@{{ node_backup_version['content'] | b64decode }}"
          ansible.builtin.npm:
            name: appdynamics
            version: "{{ node_backup_version['content'] | b64decode | regex_replace('^[~^]+', '') }}"
            path: "{{ node_agent_dest_folder }}"
            state: present
          when: backup_appd_version_exists.stat.exists

        - name: appdynamics_agent_status nodejs agent restore
          ansible.builtin.debug:
            msg: '{ "agentRollback": "Appdynamics Node agent was restored successfully "}'

        - name: agent start up result set fact
          ansible.builtin.set_fact:
            agent_result:
              app: "{{ application_name | default(appd.ansible_facts.appdynamics.app) }}"
              tier: "{{ tier_name | default(appd.ansible_facts.appdynamics.tier) }}"
              node: "{{ agent_node_name if (no_node_name_suffix | lower) == 'true' or agent_node_name | regex_search('-0$') else agent_node_name + '-0' }}"
              error: false
              install_path: "{{ agent_dir | default('') }}"
              agent_type: "{{ agent_type | default('node') }}"
              agent_version: "{{ agent_version | default('') }}"
              action: "{{ agent_action | default('') }}"

        - name: appdynamics.agent.result
          ansible.builtin.debug:
            msg: "{{ agent_result | to_json }}"

  rescue:
    - name: appdynamics_agent_status Rollback Task Failed
      ansible.builtin.debug:
        msg: '{ "agentRollback": "Error Occurred while reinstalling agent with backup."}'

    - name: Set Node Agent Result Fact
      ansible.builtin.set_fact:
        appdynamics_agent_result:
          app: null
          tier: null
          node: null
          error: true
          install_path: null
          agent_type: "{{ agent_type }}"
          agent_version: null
          action: "{{ agent_action }}"

    - name: appdynamics.agent.result
      ansible.builtin.debug:
        msg: "{{ appdynamics_agent_result | to_json }}"
